ml":"തുലസീദാസ സദാ ഹരി ചേരാ ।\nകീജൈ നാഥ ഹൃദയ മഹഁ ഡേരാ ॥","en":"Tulaseedaas sadaa hari cheraa |\nKeejai naath hriday mahan deraa ||"}],["दोहा",{"deva":"पवनतनय संकट हरन, मंगल मूरति रूप ।\nराम लखन सीता सहित, हृदय बसहु सुर भूप ॥","ta":"பவனதனய ஸங்கட ஹரன, மங்கல மூரதி ரூப ।\nராம லகன ஸீதா ஸஹித, ஹ்ருதய பஸஹு ஸுர பூப ॥","te":"పవనతనయ సంకట హరన, మంగల మూరతి రూప ।\nరామ లఖన సీతా సహిత, హృదయ బసహు సుర భూప ॥","kn":"ಪವನತನಯ ಸಂಕಟ ಹರನ, ಮಂಗಲ ಮೂರತಿ ರೂಪ ।\nರಾಮ ಲಖನ ಸೀತಾ ಸಹಿತ, ಹೃದಯ ಬಸಹು ಸುರ ಭೂಪ ॥","ml":"പവനതനയ സംകട ഹരന, മംഗല മൂരതി രൂപ ।\nരാമ ലഖന സീതാ സഹിത, ഹൃദയ ബസഹു സുര ഭൂപ ॥","en":"Pavanatanay sankat haran, mangal moorati roop |\nRaam lakhan seetaa sahit, hriday basahu sur bhoop ||"}]],"note":""},{"id":"ramraksha","g":"rama","t":{"en":"Sri Rama Raksha Stotram","ta":"ஸ்ரீ ராம ரக்ஷா ஸ்தோத்திரம்","hi":"श्री राम रक्षा स्तोत्रम्"},"src":"deva","lang":"sa","s":["deva","ta","te","kn","ml","en"],"v":[["",{"deva":"ॐ श्रीगणेशाय नमः ।\nअस्य श्रीरामरक्षास्तोत्रमन्त्रस्य । बुधकौशिक ऋषिः ।\nश्रीसीतारामचन्द्रो देवता । अनुष्टुप् छन्दः ।\nसीता शक्तिः । श्रीमद्हनुमान् कीलकम् ।\nश्रीरामचन्द्रप्रीत्यर्थे जपे विनियोगः ॥","ta":"ௐ ஸ்ரீகணேஸாய நம: ।\nஅஸ்ய ஸ்ரீராமரக்ஷாஸ்தோத்ரமந்த்ரஸ்ய । புதகௌஸிக ருஷி: ।\nஸ்ரீஸீதாராமசந்த்ரோ தேவதா । அனுஷ்டுப் சந்த: ।\nஸீதா ஸக்தி: । ஸ்ரீமத்ஹனுமான் கீலகம் ।\nஸ்ரீராமசந்த்ரப்ரீத்யர்தே ஜபே வினியோக: ॥","te":"ఓం శ్రీగణేశాయ నమః ।\nఅస్య శ్రీరామరక్షాస్తోత్రమన్త్రస్య । బుధకౌశిక ఋషిః ।\nశ్రీసీతారామచన్ద్రో దేవతా । అనుష్టుప్ ఛన్దః ।\nసీతా శక్తిః । శ్రీమద్హనుమాన్ కీలకమ్ ।\nశ్రీరామచన్ద్రప్రీత్యర్థే జపే వినియోగః ॥","kn":"ಓಂ ಶ್ರೀಗಣೇಶಾಯ ನಮಃ ।\nಅಸ್ಯ ಶ್ರೀರಾಮರಕ್ಷಾಸ್ತೋತ್ರಮನ್ತ್ರಸ್ಯ । ಬುಧಕೌಶಿಕ ಋಷಿಃ ।\nಶ್ರೀಸೀತಾರಾಮಚನ್ದ್ರೋ ದೇವತಾ । ಅನುಷ್ಟುಪ್ ಛನ್ದಃ ।\nಸೀತಾ ಶಕ್ತಿಃ । ಶ್ರೀಮದ್ಹನುಮಾನ್ ಕೀಲಕಮ್ ।\nಶ್ರೀರಾಮಚನ್ದ್ರಪ್ರೀತ್ಯರ್ಥೇ ಜಪೇ ವಿನಿಯೋಗಃ ॥","ml":"ഓം ശ്രീഗണേശായ നമഃ ।\nഅസ്യ ശ്രീരാമരക്ഷാസ്തോത്രമന്ത്രസ്യ । ബുധകൌശിക ഋഷിഃ ।\nശ്രീസീതാരാമചന്ദ്രോ ദേവതാ । അനുഷ്ടുപ് ഛന്ദഃ ।\nസീതാ ശക്തിഃ । ശ്രീമദ്ഹനുമാന് കീലകമ് ।\nശ്രീരാമചന്ദ്രപ്രീത്യര്ഥേ ജപേ വിനിയോഗഃ ॥","en":"Om shriganeshaaya namah |\nAsya shriraamarakshaastotramantrasya | budhakaushika rishih |\nShriseetaaraamachandro devataa | anushtup chhandah |\nSeetaa shaktih | shrimadhanumaan keelakam |\nShriraamachandrapreetyarthe jape viniyogah ||"}],["",{"deva":"ध्यायेदाजानुबाहुं धृतशरधनुषं बद्धपद्मासनस्थं\nपीतं वासो वसानं नवकमलदलस्पर्धिनेत्रं प्रसन्नम् ।\nवामाङ्कारूढसीतामुखकमलमिलल्लोचनं नीरदाभं\nनानालङ्कारदीप्तं दधतमुरुजटामण्डनं रामचन्द्रम् ॥","ta":"த்யாயேதாஜானுபாஹும் த்ருதஸரதனுஷம் பத்தபத்மாஸனஸ்தம்\nபீதம் வாஸோ வஸானம் நவகமலதலஸ்பர்தினேத்ரம் ப்ரஸந்னம் ।\nவாமாங்காரூடஸீதாமுககமலமிலல்லோசனம் நீரதாபம்\nநானாலங்காரதீப்தம் தததமுருஜடாமண்டனம் ராமசந்த்ரம் ॥","te":"ధ్యాయేదాజానుబాహుం ధృతశరధనుషం బద్ధపద్మాసనస్థం\nపీతం వాసో వసానం నవకమలదలస్పర్ధినేత్రం ప్రసన్నమ్ ।\nవామాఙ్కారూఢసీతాముఖకమలమిలల్లోచనం నీరదాభం\nనానాలఙ్కారదీప్తం దధతమురుజటామణ్డనం రామచన్ద్రమ్ ॥","kn":"ಧ್ಯಾಯೇದಾಜಾನುಬಾಹುಂ ಧೃತಶರಧನುಷಂ ಬದ್ಧಪದ್ಮಾಸನಸ್ಥಂ\nಪೀತಂ ವಾಸೋ ವಸಾನಂ ನವಕಮಲದಲಸ್ಪರ್ಧಿನೇತ್ರಂ ಪ್ರಸನ್ನಮ್ ।\nವಾಮಾಙ್ಕಾರೂಢಸೀತಾಮುಖಕಮಲಮಿಲಲ್ಲೋಚನಂ ನೀರದಾಭಂ\nನಾನಾಲಙ್ಕಾರದೀಪ್ತಂ ದಧತಮುರುಜಟಾಮಣ್ಡನಂ ರಾಮಚನ್ದ್ರಮ್ ॥","ml":"ധ്യായേദാജാനുബാഹും ധൃതശരധനുഷം ബദ്ധപദ്മാസനസ്ഥം\nപീതം വാസോ വസാനം നവകമലദലസ്പര്ധിനേത്രം പ്രസന്നമ് ।\nവാമാങ്കാരൂഢസീതാമുഖകമലമിലല്ലോചനം നീരദാഭം\nനാനാലങ്കാരദീപ്തം ദധതമുരുജടാമണ്ഡനം രാമചന്ദ്രമ് ॥","en":"Dhyaayedaajaanubaahum dhritasharadhanusham baddhapadmaasanastham\nPeetam vaaso vasaanam navakamaladalaspardhinetram prasannam |\nVaamaankaaroodhaseetaamukhakamalamilallochanam neeradaabham\nNaanaalankaaradeeptam dadhatamurujataamandanam raamachandram ||"}],["1",{"deva":"चरितं रघुनाथस्य शतकोटिप्रविस्तरम् ।\nएकैकमक्षरं पुंसां महापातकनाशनम् ॥","ta":"சரிதம் ரகுனாதஸ்ய ஸதகோடிப்ரவிஸ்தரம் ।\nஏகைகமக்ஷரம் பும்ஸாம் மஹாபாதகனாஸனம் ॥","te":"చరితం రఘునాథస్య శతకోటిప్రవిస్తరమ్ ।\nఏకైకమక్షరం పుంసాం మహాపాతకనాశనమ్ ॥","kn":"ಚರಿತಂ ರಘುನಾಥಸ್ಯ ಶತಕೋಟಿಪ್ರವಿಸ್ತರಮ್ ।\nಏಕೈಕಮಕ್ಷರಂ ಪುಂಸಾಂ ಮಹಾಪಾತಕನಾಶನಮ್ ॥","ml":"ചരിതം രഘുനാഥസ്യ ശതകോടിപ്രവിസ്തരമ് ।\nഏകൈകമക്ഷരം പുംസാം മഹാപാതകനാശനമ് ॥","en":"Charitam raghunaathasya shatakotipravistaram |\nEkaikamaksharam pumsaam mahaapaatakanaashanam ||"}],["2",{"deva":"ध्यात्वा नीलोत्पलश्यामं रामं राजीवलोचनम् ।\nजानकीलक्ष्मणोपेतं जटामुकुटमण्डितम् ॥","ta":"த்யாத்வா நீலோத்பலஸ்யாமம் ராமம் ராஜீவலோசனம் ।\nஜானகீலக்ஷ்மணோபேதம் ஜடாமுகுடமண்டிதம் ॥","te":"ధ్యాత్వా నీలోత్పలశ్యామం రామం రాజీవలోచనమ్ ।\nజానకీలక్ష్మణోపేతం జటాముకుటమణ్డితమ్ ॥","kn":"ಧ್ಯಾತ್ವಾ ನೀಲೋತ್ಪಲಶ್ಯಾಮಂ ರಾಮಂ ರಾಜೀವಲೋಚನಮ್ ।\nಜಾನಕೀಲಕ್ಷ್ಮಣೋಪೇತಂ ಜಟಾಮುಕುಟಮಣ್ಡಿತಮ್ ॥","ml":"ധ്യാത്വാ നീലോത്പലശ്യാമം രാമം രാജീവലോചനമ് ।\nജാനകീലക്ഷ്മണോപേതം ജടാമുകുടമണ്ഡിതമ് ॥","en":"Dhyaatvaa neelotpalashyaamam raamam raajeevalochanam |\nJaanakeelakshmanopetam jataamukutamanditam ||"}],["3",{"deva":"सासितूणधनुर्बाणपाणिं नक्तंचरान्तकम् ।\nस्वलीलया जगत्त्रातुमाविर्भूतमजं विभुम् ॥","ta":"ஸாஸிதூணதனுர்பாணபாணிம் நக்தஞ்சராந்தகம் ।\nஸ்வலீலயா ஜகத்த்ராதுமாவிர்பூதமஜம் விபும் ॥","te":"సాసితూణధనుర్బాణపాణిం నక్తంచరాన్తకమ్ ।\nస్వలీలయా జగత్త్రాతుమావిర్భూతమజం విభుమ్ ॥","kn":"ಸಾಸಿತೂಣಧನುರ್ಬಾಣಪಾಣಿಂ ನಕ್ತಂಚರಾನ್ತಕಮ್ ।\nಸ್ವಲೀಲಯಾ ಜಗತ್ತ್ರಾತುಮಾವಿರ್ಭೂತಮಜಂ ವಿಭುಮ್ ॥","ml":"സാസിതൂണധനുര്ബാണപാണിം നക്തംചരാന്തകമ് ।\nസ്വലീലയാ ജഗത്ത്രാതുമാവിര്ഭൂതമജം വിഭുമ് ॥","en":"Saasitoonadhanurbaanapaanim naktancharaantakam |\nSvaleelayaa jagattraatumaavirbhootamajam vibhum ||"}],["4",{"deva":"रामरक्षां पठेत्प्राज्ञः पापघ्नीं सर्वकामदाम् ।\nशिरो मे राघवः पातु भालं दशरथात्मजः ॥","ta":"ராமரக்ஷாம் படேத்ப்ராஞ: பாபக்னீம் ஸர்வகாமதாம் ।\nஸிரோ மே ராகவ: பாது பாலம் தஸரதாத்மஜ: ॥","te":"రామరక్షాం పఠేత్ప్రాజ్ఞః పాపఘ్నీం సర్వకామదామ్ ।\nశిరో మే రాఘవః పాతు భాలం దశరథాత్మజః ॥","kn":"ರಾಮರಕ್ಷಾಂ ಪಠೇತ್ಪ್ರಾಜ್ಞಃ ಪಾಪಘ್ನೀಂ ಸರ್ವಕಾಮದಾಮ್ ।\nಶಿರೋ ಮೇ ರಾಘವಃ ಪಾತು ಭಾಲಂ ದಶರಥಾತ್ಮಜಃ ॥","ml":"രാമരക്ഷാം പഠേത്പ്രാജ്ഞഃ പാപഘ്നീം സര്വകാമദാമ് ।\nശിരോ മേ രാഘവഃ പാതു ഭാലം ദശരഥാത്മജഃ ॥","en":"Raamarakshaam pathetpraajnah paapaghneem sarvakaamadaam |\nShiro me raaghavah paatu bhaalam dasharathaatmajah ||"}],["5",{"deva":"कौसल्येयो दृशौ पातु विश्वामित्रप्रियः श्रुती ।\nघ्राणं पातु मखत्राता मुखं सौमित्रिवत्सलः ॥","ta":"கௌஸல்யேயோ த்ருஸௌ பாது விஸ்வாமித்ரப்ரிய: ஸ்ருதீ ।\nக்ராணம் பாது மகத்ராதா முகம் ஸௌமித்ரிவத்ஸல: ॥","te":"కౌసల్యేయో దృశౌ పాతు విశ్వామిత్రప్రియః శ్రుతీ ।\nఘ్రాణం పాతు మఖత్రాతా ముఖం సౌమిత్రివత్సలః ॥","kn":"ಕೌಸಲ್ಯೇಯೋ ದೃಶೌ ಪಾತು ವಿಶ್ವಾಮಿತ್ರಪ್ರಿಯಃ ಶ್ರುತೀ ।\nಘ್ರಾಣಂ ಪಾತು ಮಖತ್ರಾತಾ ಮುಖಂ ಸೌಮಿತ್ರಿವತ್ಸಲಃ ॥","ml":"കൌസല്യേയോ ദൃശൌ പാതു വിശ്വാമിത്രപ്രിയഃ ശ്രുതീ ।\nഘ്രാണം പാതു മഖത്രാതാ മുഖം സൌമിത്രിവത്സലഃ ॥","en":"Kausalyeyo drishau paatu vishvaamitrapriyah shrutee |\nGhraanam paatu makhatraataa mukham saumitrivatsalah ||"}],["6",{"deva":"जिह्वां विद्यानिधिः पातु कण्ठं भरतवन्दितः ।\nस्कन्धौ दिव्यायुधः पातु भुजौ भग्नेशकार्मुकः ॥","ta":"ஜிஹ்வாம் வித்யானிதி: பாது கண்டம் பரதவந்தித: ।\nஸ்கந்தௌ திவ்யாயுத: பாது புஜௌ பக்னேஸகார்முக: ॥","te":"జిహ్వాం విద్యానిధిః పాతు కణ్ఠం భరతవన్దితః ।\nస్కన్ధౌ దివ్యాయుధః పాతు భుజౌ భగ్నేశకార్ముకః ॥","kn":"ಜಿಹ್ವಾಂ ವಿದ್ಯಾನಿಧಿಃ ಪಾತು ಕಣ್ಠಂ ಭರತವನ್ದಿತಃ ।\nಸ್ಕನ್ಧೌ ದಿವ್ಯಾಯುಧಃ ಪಾತು ಭುಜೌ ಭಗ್ನೇಶಕಾರ್ಮುಕಃ ॥","ml":"ജിഹ്വാം വിദ്യാനിധിഃ പാതു കണ്ഠം ഭരതവന്ദിതഃ ।\nസ്കന്ധൌ ദിവ്യായുധഃ പാതു ഭുജൌ ഭഗ്നേശകാര്മുകഃ ॥","en":"Jihvaam vidyaanidhih paatu kantham bharatavanditah |\nSkandhau divyaayudhah paatu bhujau bhagneshakaarmukah ||"}],["7",{"deva":"करौ सीतापतिः पातु हृदयं जामदग्न्यजित् ।\nमध्यं पातु खरध्वंसी नाभिं जाम्बवदाश्रयः ॥","ta":"கரௌ ஸீதாபதி: பாது ஹ்ருதயம் ஜாமதக்ன்யஜித் ।\nமத்யம் பாது கரத்வம்ஸீ நாபிம் ஜாம்பவதாஸ்ரய: ॥","te":"కరౌ సీతాపతిః పాతు హృదయం జామదగ్న్యజిత్ ।\nమధ్యం పాతు ఖరధ్వంసీ నాభిం జామ్బవదాశ్రయః ॥","kn":"ಕರೌ ಸೀತಾಪತಿಃ ಪಾತು ಹೃದಯಂ ಜಾಮದಗ್ನ್ಯಜಿತ್ ।\nಮಧ್ಯಂ ಪಾತು ಖರಧ್ವಂಸೀ ನಾಭಿಂ ಜಾಮ್ಬವದಾಶ್ರಯಃ ॥","ml":"കരൌ സീതാപതിഃ പാതു ഹൃദയം ജാമദഗ്ന്യജിത് ।\nമധ്യം പാതു ഖരധ്വംസീ നാഭിം ജാമ്ബവദാശ്രയഃ ॥","en":"Karau seetaapatih paatu hridayam jaamadagnyajit |\nMadhyam paatu kharadhvamsee naabhim jaambavadaashrayah ||"}],["8",{"deva":"सुग्रीवेशः कटी पातु सक्थिनी हनुमत्प्रभुः ।\nऊरू रघूत्तमः पातु रक्षःकुलविनाशकृत् ॥","ta":"ஸுக்ரீவேஸ: கடீ பாது ஸக்தினீ ஹனுமத்ப்ரபு: ।\nஊரூ ரகூத்தம: பாது ரக்ஷ:குலவினாஸக்ருத் ॥","te":"సుగ్రీవేశః కటీ పాతు సక్థినీ హనుమత్ప్రభుః ।\nఊరూ రఘూత్తమః పాతు రక్షఃకులవినాశకృత్ ॥","kn":"ಸುಗ್ರೀವೇಶಃ ಕಟೀ ಪಾತು ಸಕ್ಥಿನೀ ಹನುಮತ್ಪ್ರಭುಃ ।\nಊರೂ ರಘೂತ್ತಮಃ ಪಾತು ರಕ್ಷಃಕುಲವಿನಾಶಕೃತ್ ॥","ml":"സുഗ്രീവേശഃ കടീ പാതു സക്ഥിനീ ഹനുമത്പ്രഭുഃ ।\nഊരൂ രഘൂത്തമഃ പാതു രക്ഷഃകുലവിനാശകൃത് ॥","en":"Sugreeveshah katee paatu sakthinee hanumatprabhuh |\nOoroo raghoottamah paatu rakshahkulavinaashakrit ||"}],["9",{"deva":"जानुनी सेतुकृत्पातु जङ्घे दशमुखान्तकः ।\nपादौ बिभीषणश्रीदः पातु रामोऽखिलं वपुः ॥","ta":"ஜானுனீ ஸேதுக்ருத்பாது ஜங்கே தஸமுகாந்தக: ।\nபாதௌ பிபீஷணஸ்ரீத: பாது ராமோகிலம் வபு: ॥","te":"జానునీ సేతుకృత్పాతు జఙ్ఘే దశముఖాన్తకః ।\nపాదౌ బిభీషణశ్రీదః పాతు రామోఽఖిలం వపుః ॥","kn":"ಜಾನುನೀ ಸೇತುಕೃತ್ಪಾತು ಜಙ್ಘೇ ದಶಮುಖಾನ್ತಕಃ ।\nಪಾದೌ ಬಿಭೀಷಣಶ್ರೀದಃ ಪಾತು ರಾಮೋಽಖಿಲಂ ವಪುಃ ॥","ml":"ജാനുനീ സേതുകൃത്പാതു ജങ്ഘേ ദശമുഖാന്തകഃ ।\nപാദൌ ബിഭീഷണശ്രീദഃ പാതു രാമോഽഖിലം വപുഃ ॥","en":"Jaanunee setukritpaatu janghe dashamukhaantakah |\nPaadau bibheeshanashreedah paatu raamo'khilam vapuh ||"}],["10",{"deva":"एतां रामबलोपेतां रक्षां यः सुकृती पठेत् ।\nस चिरायुः सुखी पुत्री विजयी विनयी भवेत् ॥","ta":"ஏதாம் ராமபலோபேதாம் ரக்ஷாம் ய: ஸுக்ருதீ படேத் ।\nஸ சிராயு: ஸுகீ புத்ரீ விஜயீ வினயீ பவேத் ॥","te":"ఏతాం రామబలోపేతాం రక్షాం యః సుకృతీ పఠేత్ ।\nస చిరాయుః సుఖీ పుత్రీ విజయీ వినయీ భవేత్ ॥","kn":"ಏತಾಂ ರಾಮಬಲೋಪೇತಾಂ ರಕ್ಷಾಂ ಯಃ ಸುಕೃತೀ ಪಠೇತ್ ।\nಸ ಚಿರಾಯುಃ ಸುಖೀ ಪುತ್ರೀ ವಿಜಯೀ ವಿನಯೀ ಭವೇತ್ ॥","ml":"ഏതാം രാമബലോപേതാം രക്ഷാം യഃ സുകൃതീ പഠേത് ।\nസ ചിരായുഃ സുഖീ പുത്രീ വിജയീ വിനയീ ഭവേത് ॥","en":"Etaam raamabalopetaam rakshaam yah sukritee pathet |\nSa chiraayuh sukhee putree vijayee vinayee bhavet ||"}],["11",{"deva":"पातालभूतलव्योमचारिणश्छद्मचारिणः ।\nन द्रष्टुमपि शक्तास्ते रक्षितं रामनामभिः ॥","ta":"பாதாலபூதலவ்யோமசாரிணஸ்சத்மசாரிண: ।\nந த்ரஷ்டுமபி ஸக்தாஸ்தே ரக்ஷிதம் ராமனாமபி: ॥","te":"పాతాలభూతలవ్యోమచారిణశ్ఛద్మచారిణః ।\nన ద్రష్టుమపి శక్తాస్తే రక్షితం రామనామభిః ॥","kn":"ಪಾತಾಲಭೂತಲವ್ಯೋಮಚಾರಿಣಶ್ಛದ್ಮಚಾರಿಣಃ ।\nನ ದ್ರಷ್ಟುಮಪಿ ಶಕ್ತಾಸ್ತೇ ರಕ್ಷಿತಂ ರಾಮನಾಮಭಿಃ ॥","ml":"പാതാലഭൂതലവ്യോമചാരിണശ്ഛദ്മചാരിണഃ ।\nന ദ്രഷ്ടുമപി ശക്താസ്തേ രക്ഷിതം രാമനാമഭിഃ ॥","en":"Paataalabhootalavyomachaarinashchhadmachaarinah |\nNa drashtumapi shaktaaste rakshitam raamanaamabhih ||"}],["12",{"deva":"रामेति रामभद्रेति रामचन्द्रेति वा स्मरन् ।\nनरो न लिप्यते पापैर्भुक्तिं मुक्तिं च विन्दति ॥","ta":"ராமேதி ராமபத்ரேதி ராமசந்த்ரேதி வா ஸ்மரன் ।\nநரோ ந லிப்யதே பாபைர்புக்திம் முக்திம் ச விந்ததி ॥","te":"రామేతి రామభద్రేతి రామచన్ద్రేతి వా స్మరన్ ।\nనరో న లిప్యతే పాపైర్భుక్తిం ముక్తిం చ విన్దతి ॥","kn":"ರಾಮೇತಿ ರಾಮಭದ್ರೇತಿ ರಾಮಚನ್ದ್ರೇತಿ ವಾ ಸ್ಮರನ್ ।\nನರೋ ನ ಲಿಪ್ಯತೇ ಪಾಪೈರ್ಭುಕ್ತಿಂ ಮುಕ್ತಿಂ ಚ ವಿನ್ದತಿ ॥","ml":"രാമേതി രാമഭദ്രേതി രാമചന്ദ്രേതി വാ സ്മരന് ।\nനരോ ന ലിപ്യതേ പാപൈര്ഭുക്തിം മുക്തിം ച വിന്ദതി ॥","en":"Raameti raamabhadreti raamachandreti vaa smaran |\nNaro na lipyate paapairbhuktim muktim cha vindati ||"}],["13",{"deva":"जगज्जैत्रैकमन्त्रेण रामनाम्नाभिरक्षितम् ।\nयः कण्ठे धारयेत्तस्य करस्थाः सर्वसिद्धयः ॥","ta":"ஜகஜ்ஜைத்ரைகமந்த்ரேண ராமனாம்னாபிரக்ஷிதம் ।\nய: கண்டே தாரயேத்தஸ்ய கரஸ்தா: ஸர்வஸித்தய: ॥","te":"జగజ్జైత్రైకమన్త్రేణ రామనామ్నాభిరక్షితమ్ ।\nయః కణ్ఠే ధారయేత్తస్య కరస్థాః సర్వసిద్ధయః ॥","kn":"ಜಗಜ್ಜೈತ್ರೈಕಮನ್ತ್ರೇಣ ರಾಮನಾಮ್ನಾಭಿರಕ್ಷಿತಮ್ ।\nಯಃ ಕಣ್ಠೇ ಧಾರಯೇತ್ತಸ್ಯ ಕರಸ್ಥಾಃ ಸರ್ವಸಿದ್ಧಯಃ ॥","ml":"ജഗജ്ജൈത്രൈകമന്ത്രേണ രാമനാമ്നാഭിരക്ഷിതമ് ।\nയഃ കണ്ഠേ ധാരയേത്തസ്യ കരസ്ഥാഃ സര്വസിദ്ധയഃ ॥","en":"Jagajjaitraikamantrena raamanaamnaabhirakshitam |\nYah kanthe dhaarayettasya karasthaah sarvasiddhayah ||"}],["14",{"deva":"वज्रपञ्जरनामेदं यो रामकवचं स्मरेत् ।\nअव्याहताज्ञः सर्वत्र लभते जयमङ्गलम् ॥","ta":"வஜ்ரபஞ்ஜரனாமேதம் யோ ராமகவசம் ஸ்மரேத் ।\nஅவ்யாஹதாஞ: ஸர்வத்ர லபதே ஜயமங்கலம் ॥","te":"వజ్రపఞ్జరనామేదం యో రామకవచం స్మరేత్ ।\nఅవ్యాహతాజ్ఞః సర్వత్ర లభతే జయమఙ్గలమ్ ॥","kn":"ವಜ್ರಪಞ್ಜರನಾಮೇದಂ ಯೋ ರಾಮಕವಚಂ ಸ್ಮರೇತ್ ।\nಅವ್ಯಾಹತಾಜ್ಞಃ ಸರ್ವತ್ರ ಲಭತೇ ಜಯಮಙ್ಗಲಮ್ ॥","ml":"വജ്രപഞ്ജരനാമേദം യോ രാമകവചം സ്മരേത് ।\nഅവ്യാഹതാജ്ഞഃ സര്വത്ര ലഭതേ ജയമങ്ഗലമ് ॥","en":"Vajrapanjaranaamedam yo raamakavacham smaret |\nAvyaahataajnah sarvatra labhate jayamangalam ||"}],["15",{"deva":"आदिष्टवान्यथा स्वप्ने रामरक्षामिमां हरः ।\nतथा लिखितवान्प्रातः प्रबुद्धो बुधकौशिकः ॥","ta":"ஆதிஷ்டவான்யதா ஸ்வப்னே ராமரக்ஷாமிமாம் ஹர: ।\nததா லிகிதவான்ப்ராத: ப்ரபுத்தோ புதகௌஸிக: ॥","te":"ఆదిష్టవాన్యథా స్వప్నే రామరక్షామిమాం హరః ।\nతథా లిఖితవాన్ప్రాతః ప్రబుద్ధో బుధకౌశికః ॥","kn":"ಆದಿಷ್ಟವಾನ್ಯಥಾ ಸ್ವಪ್ನೇ ರಾಮರಕ್ಷಾಮಿಮಾಂ ಹರಃ ।\nತಥಾ ಲಿಖಿತವಾನ್ಪ್ರಾತಃ ಪ್ರಬುದ್ಧೋ ಬುಧಕೌಶಿಕಃ ॥","ml":"ആദിഷ്ടവാന്യഥാ സ്വപ്നേ രാമരക്ഷാമിമാം ഹരഃ ।\nതഥാ ലിഖിതവാന്പ്രാതഃ പ്രബുദ്ധോ ബുധകൌശികഃ ॥","en":"Aadishtavaanyathaa svapne raamarakshaamimaam harah |\nTathaa likhitavaanpraatah prabuddho budhakaushikah ||"}],["16",{"deva":"आरामः कल्पवृक्षाणां विरामः सकलापदाम् ।\nअभिरामस्त्रिलोकानां रामः श्रीमान्स नः प्रभुः ॥","ta":"ஆராம: கல்பவ்ருக்ஷாணாம் விராம: ஸகலாபதாம் ।\nஅபிராமஸ்த்ரிலோகானாம் ராம: ஸ்ரீமான்ஸ ந: ப்ரபு: ॥","te":"ఆరామః కల్పవృక్షాణాం విరామః సకలాపదామ్ ।\nఅభిరామస్త్రిలోకానాం రామః శ్రీమాన్స నః ప్రభుః ॥","kn":"ಆರಾಮಃ ಕಲ್ಪವೃಕ್ಷಾಣಾಂ ವಿರಾಮಃ ಸಕಲಾಪದಾಮ್ ।\nಅಭಿರಾಮಸ್ತ್ರಿಲೋಕಾನಾಂ ರಾಮಃ ಶ್ರೀಮಾನ್ಸ ನಃ ಪ್ರಭುಃ ॥","ml":"ആരാമഃ കല്പവൃക്ഷാണാം വിരാമഃ സകലാപദാമ് ।\nഅഭിരാമസ്ത്രിലോകാനാം രാമഃ ശ്രീമാന്സ നഃ പ്രഭുഃ ॥","en":"Aaraamah kalpavrikshaanaam viraamah sakalaapadaam |\nAbhiraamastrilokaanaam raamah shrimaansa nah prabhuh ||"}],["17",{"deva":"तरुणौ रूपसम्पन्नौ सुकुमारौ महाबलौ ।\nपुण्डरीकविशालाक्षौ चीरकृष्णाजिनाम्बरौ ॥","ta":"தருணௌ ரூபஸம்பந்னௌ ஸுகுமாரௌ மஹாபலௌ ।\nபுண்டரீகவிஸாலாக்ஷௌ சீரக்ருஷ்ணாஜினாம்பரௌ ॥","te":"తరుణౌ రూపసమ్పన్నౌ సుకుమారౌ మహాబలౌ ।\nపుణ్డరీకవిశాలాక్షౌ చీరకృష్ణాజినామ్బరౌ ॥","kn":"ತರುಣೌ ರೂಪಸಮ್ಪನ್ನೌ ಸುಕುಮಾರೌ ಮಹಾಬಲೌ ।\nಪುಣ್ಡರೀಕವಿಶಾಲಾಕ್ಷೌ ಚೀರಕೃಷ್ಣಾಜಿನಾಮ್ಬರೌ ॥","ml":"തരുണൌ രൂപസമ്പന്നൌ സുകുമാരൌ മഹാബലൌ ।\nപുണ്ഡരീകവിശാലാക്ഷൌ ചീരകൃഷ്ണാജിനാമ്ബരൌ ॥","en":"Tarunau roopasampannau sukumaarau mahaabalau |\nPundareekavishaalaakshau cheerakrishnaajinaambarau ||"}],["18",{"deva":"फलमूलाशिनौ दान्तौ तापसौ ब्रह्मचारिणौ ।\nपुत्रौ दशरथस्यैतौ भ्रातरौ रामलक्ष्मणौ ॥","ta":"பலமூலாஸினௌ தாந்தௌ தாபஸௌ ப்ரஹ்மசாரிணௌ ।\nபுத்ரௌ தஸரதஸ்யைதௌ ப்ராதரௌ ராமலக்ஷ்மணௌ ॥","te":"ఫలమూలాశినౌ దాన్తౌ తాపసౌ బ్రహ్మచారిణౌ ।\nపుత్రౌ దశరథస్యైతౌ భ్రాతరౌ రామలక్ష్మణౌ ॥","kn":"ಫಲಮೂಲಾಶಿನೌ ದಾನ್ತೌ ತಾಪಸೌ ಬ್ರಹ್ಮಚಾರಿಣೌ ।\nಪುತ್ರೌ ದಶರಥಸ್ಯೈತೌ ಭ್ರಾತರೌ ರಾಮಲಕ್ಷ್ಮಣೌ ॥","ml":"ഫലമൂലാശിനൌ ദാന്തൌ താപസൌ ബ്രഹ്മചാരിണൌ ।\nപുത്രൌ ദശരഥസ്യൈതൌ ഭ്രാതരൌ രാമലക്ഷ്മണൌ ॥","en":"Phalamoolaashinau daantau taapasau brahmachaarinau |\nPutrau dasharathasyaitau bhraatarau raamalakshmanau ||"}],["19",{"deva":"शरण्यौ सर्वसत्त्वानां श्रेष्ठौ सर्वधनुष्मताम् ।\nरक्षःकुलनिहन्तारौ त्रायेतां नो रघूत्तमौ ॥","ta":"ஸரண்யௌ ஸர்வஸத்த்வானாம் ஸ்ரேஷ்டௌ ஸர்வதனுஷ்மதாம் ।\nரக்ஷ:குலனிஹந்தாரௌ த்ராயேதாம் நோ ரகூத்தமௌ ॥","te":"శరణ్యౌ సర్వసత్త్వానాం శ్రేష్ఠౌ సర్వధనుష్మతామ్ ।\nరక్షఃకులనిహన్తారౌ త్రాయేతాం నో రఘూత్తమౌ ॥","kn":"ಶರಣ್ಯೌ ಸರ್ವಸತ್ತ್ವಾನಾಂ ಶ್ರೇಷ್ಠೌ ಸರ್ವಧನುಷ್ಮತಾಮ್ ।\nರಕ್ಷಃಕುಲನಿಹನ್ತಾರೌ ತ್ರಾಯೇತಾಂ ನೋ ರಘೂತ್ತಮೌ ॥","ml":"ശരണ്യൌ സര്വസത്ത്വാനാം ശ്രേഷ്ഠൌ സര്വധനുഷ്മതാമ് ।\nരക്ഷഃകുലനിഹന്താരൌ ത്രായേതാം നോ രഘൂത്തമൌ ॥","en":"Sharanyau sarvasattvaanaam shreshthau sarvadhanushmataam |\nRakshahkulanihantaarau traayetaam no raghoottamau ||"}],["20",{"deva":"आत्तसज्यधनुषाविषुस्पृशावक्षयाशुगनिषङ्गसङ्गिनौ ।\nरक्षणाय मम रामलक्ष्मणावग्रतः पथि सदैव गच्छताम् ॥","ta":"ஆத்தஸஜ்யதனுஷாவிஷுஸ்ப்ருஸாவக்ஷயாஸுகனிஷங்கஸங்கினௌ ।\nரக்ஷணாய மம ராமலக்ஷ்மணாவக்ரத: பதி ஸதைவ கச்சதாம் ॥","te":"ఆత్తసజ్యధనుషావిషుస్పృశావక్షయాశుగనిషఙ్గసఙ్గినౌ ।\nరక్షణాయ మమ రామలక్ష్మణావగ్రతః పథి సదైవ గచ్ఛతామ్ ॥","kn":"ಆತ್ತಸಜ್ಯಧನುಷಾವಿಷುಸ್ಪೃಶಾವಕ್ಷಯಾಶುಗನಿಷಙ್ಗಸಙ್ಗಿನೌ ।\nರಕ್ಷಣಾಯ ಮಮ ರಾಮಲಕ್ಷ್ಮಣಾವಗ್ರತಃ ಪಥಿ ಸದೈವ ಗಚ್ಛತಾಮ್ ॥","ml":"ആത്തസജ്യധനുഷാവിഷുസ്പൃശാവക്ഷയാശുഗനിഷങ്ഗസങ്ഗിനൌ ।\nരക്ഷണായ മമ രാമലക്ഷ്മണാവഗ്രതഃ പഥി സദൈവ ഗച്ഛതാമ് ॥","en":"Aattasajyadhanushaavishusprishaavakshayaashuganishangasanginau |\nRakshanaaya mama raamalakshmanaavagratah pathi sadaiva gachchhataam ||"}],["21",{"deva":"सन्नद्धः कवची खड्गी चापबाणधरो युवा ।\nगच्छन्मनोरथोऽस्माकं रामः पातु सलक्ष्मणः ॥","ta":"ஸந்னத்த: கவசீ கட்கீ சாபபாணதரோ யுவா ।\nகச்சன்மனோரதோஸ்மாகம் ராம: பாது ஸலக்ஷ்மண: ॥","te":"సన్నద్ధః కవచీ ఖడ్గీ చాపబాణధరో యువా ।\nగచ్ఛన్మనోరథోఽస్మాకం రామః పాతు సలక్ష్మణః ॥","kn":"ಸನ್ನದ್ಧಃ ಕವಚೀ ಖಡ್ಗೀ ಚಾಪಬಾಣಧರೋ ಯುವಾ ।\nಗಚ್ಛನ್ಮನೋರಥೋಽಸ್ಮಾಕಂ ರಾಮಃ ಪಾತು ಸಲಕ್ಷ್ಮಣಃ ॥","ml":"സന്നദ്ധഃ കവചീ ഖഡ്ഗീ ചാപബാണധരോ യുവാ ।\nഗച്ഛന്മനോരഥോഽസ്മാകം രാമഃ പാതു സലക്ഷ്മണഃ ॥","en":"Sannaddhah kavachee khadgee chaapabaanadharo yuvaa |\nGachchhanmanoratho'smaakam raamah paatu salakshmanah ||"}],["22",{"deva":"रामो दाशरथिः शूरो लक्ष्मणानुचरो बली ।\nकाकुत्स्थः पुरुषः पूर्णः कौसल्येयो रघूत्तमः ॥","ta":"ராமோ தாஸரதி: ஸூரோ லக்ஷ்மணானுசரோ பலீ ।\nகாகுத்ஸ்த: புருஷ: பூர்ண: கௌஸல்யேயோ ரகூத்தம: ॥","te":"రామో దాశరథిః శూరో లక్ష్మణానుచరో బలీ ।\nకాకుత్స్థః పురుషః పూర్ణః కౌసల్యేయో రఘూత్తమః ॥","kn":"ರಾಮೋ ದಾಶರಥಿಃ ಶೂರೋ ಲಕ್ಷ್ಮಣಾನುಚರೋ ಬಲೀ ।\nಕಾಕುತ್ಸ್ಥಃ ಪುರುಷಃ ಪೂರ್ಣಃ ಕೌಸಲ್ಯೇಯೋ ರಘೂತ್ತಮಃ ॥","ml":"രാമോ ദാശരഥിഃ ശൂരോ ലക്ഷ്മണാനുചരോ ബലീ ।\nകാകുത്സ്ഥഃ പുരുഷഃ പൂര്ണഃ കൌസല്യേയോ രഘൂത്തമഃ ॥","en":"Raamo daasharathih shooro lakshmanaanucharo balee |\nKaakutsthah purushah poornah kausalyeyo raghoottamah ||"}],["23",{"deva":"वेदान्तवेद्यो यज्ञेशः पुराणपुरुषोत्तमः ।\nजानकीवल्लभः श्रीमानप्रमेयपराक्रमः ॥","ta":"வேதாந்தவேத்யோ யஞேஸ: புராணபுருஷோத்தம: ।\nஜானகீவல்லப: ஸ்ரீமானப்ரமேயபராக்ரம: ॥","te":"వేదాన్తవేద్యో యజ్ఞేశః పురాణపురుషోత్తమః ।\nజానకీవల్లభః శ్రీమానప్రమేయపరాక్రమః ॥","kn":"ವೇದಾನ್ತವೇದ್ಯೋ ಯಜ್ಞೇಶಃ ಪುರಾಣಪುರುಷೋತ್ತಮಃ ।\nಜಾನಕೀವಲ್ಲಭಃ ಶ್ರೀಮಾನಪ್ರಮೇಯಪರಾಕ್ರಮಃ ॥","ml":"വേദാന്തവേദ്യോ യജ്ഞേശഃ പുരാണപുരുഷോത്തമഃ ।\nജാനകീവല്ലഭഃ ശ്രീമാനപ്രമേയപരാക്രമഃ ॥","en":"Vedaantavedyo yajneshah puraanapurushottamah |\nJaanakeevallabhah shrimaanaprameyaparaakramah ||"}],["24",{"deva":"इत्येतानि जपन्नित्यं मद्भक्तः श्रद्धयान्वितः ।\nअश्वमेधाधिकं पुण्यं सम्प्राप्नोति न संशयः ॥","ta":"இத்யேதானி ஜபந்னித்யம் மத்பக்த: ஸ்ரத்தயான்வித: ।\nஅஸ்வமேதாதிகம் புண்யம் ஸம்ப்ராப்னோதி ந ஸம்ஸய: ॥","te":"ఇత్యేతాని జపన్నిత్యం మద్భక్తః శ్రద్ధయాన్వితః ।\nఅశ్వమేధాధికం పుణ్యం సమ్ప్రాప్నోతి న సంశయః ॥","kn":"ಇತ್ಯೇತಾನಿ ಜಪನ್ನಿತ್ಯಂ ಮದ್ಭಕ್ತಃ ಶ್ರದ್ಧಯಾನ್ವಿತಃ ।\nಅಶ್ವಮೇಧಾಧಿಕಂ ಪುಣ್ಯಂ ಸಮ್ಪ್ರಾಪ್ನೋತಿ ನ ಸಂಶಯಃ ॥","ml":"ഇത്യേതാനി ജപന്നിത്യം മദ്ഭക്തഃ ശ്രദ്ധയാന്വിതഃ ।\nഅശ്വമേധാധികം പുണ്യം സമ്പ്രാപ്നോതി ന സംശയഃ ॥","en":"Ityetaani japannityam madbhaktah shraddhayaanvitah |\nAshvamedhaadhikam punyam sampraapnoti na samshayah ||"}],["25",{"deva":"रामं दूर्वादलश्यामं पद्माक्षं पीतवाससम् ।\nस्तुवन्ति नामभिर्दिव्यैर्न ते संसारिणो नराः ॥","ta":"ராமம் தூர்வாதலஸ்யாமம் பத்மாக்ஷம் பீதவாஸஸம் ।\nஸ்துவந்தி நாமபிர்திவ்யைர்ன தே ஸம்ஸாரிணோ நரா: ॥","te":"రామం దూర్వాదలశ్యామం పద్మాక్షం పీతవాససమ్ ।\nస్తువన్తి నామభిర్దివ్యైర్న తే సంసారిణో నరాః ॥","kn":"ರಾಮಂ ದೂರ್ವಾದಲಶ್ಯಾಮಂ ಪದ್ಮಾಕ್ಷಂ ಪೀತವಾಸಸಮ್ ।\nಸ್ತುವನ್ತಿ ನಾಮಭಿರ್ದಿವ್ಯೈರ್ನ ತೇ ಸಂಸಾರಿಣೋ ನರಾಃ ॥","ml":"രാമം ദൂര്വാദലശ്യാമം പദ്മാക്ഷം പീതവാസസമ് ।\nസ്തുവന്തി നാമഭിര്ദിവ്യൈര്ന തേ സംസാരിണോ നരാഃ ॥","en":"Raamam doorvaadalashyaamam padmaaksham peetavaasasam |\nStuvanti naamabhirdivyairna te samsaarino naraah ||"}],["26",{"deva":"रामं लक्ष्मणपूर्वजं रघुवरं सीतापतिं सुन्दरं\nकाकुत्स्थं करुणार्णवं गुणनिधिं विप्रप्रियं धार्मिकम् ।\nराजेन्द्रं सत्यसन्धं दशरथतनयं श्यामलं शान्तमूर्तिं\nवन्दे लोकाभिरामं रघुकुलतिलकं राघवं रावणारिम् ॥","ta":"ராமம் லக்ஷ்மணபூர்வஜம் ரகுவரம் ஸீதாபதிம் ஸுந்தரம்\nகாகுத்ஸ்தம் கருணார்ணவம் குணனிதிம் விப்ரப்ரியம் தார்மிகம் ।\nராஜேந்த்ரம் ஸத்யஸந்தம் தஸரததனயம் ஸ்யாமலம் ஸாந்தமூர்திம்\nவந்தே லோகாபிராமம் ரகுகுலதிலகம் ராகவம் ராவணாரிம் ॥","te":"రామం లక్ష్మణపూర్వజం రఘువరం సీతాపతిం సున్దరం\nకాకుత్స్థం కరుణార్ణవం గుణనిధిం విప్రప్రియం ధార్మికమ్ ।\nరాజేన్ద్రం సత్యసన్ధం దశరథతనయం శ్యామలం శాన్తమూర్తిం\nవన్దే లోకాభిరామం రఘుకులతిలకం రాఘవం రావణారిమ్ ॥","kn":"ರಾಮಂ ಲಕ್ಷ್ಮಣಪೂರ್ವಜಂ ರಘುವರಂ ಸೀತಾಪತಿಂ ಸುನ್ದರಂ\nಕಾಕುತ್ಸ್ಥಂ ಕರುಣಾರ್ಣವಂ ಗುಣನಿಧಿಂ ವಿಪ್ರಪ್ರಿಯಂ ಧಾರ್ಮಿಕಮ್ ।\nರಾಜೇನ್ದ್ರಂ ಸತ್ಯಸನ್ಧಂ ದಶರಥತನಯಂ ಶ್ಯಾಮಲಂ ಶಾನ್ತಮೂರ್ತಿಂ\nವನ್ದೇ ಲೋಕಾಭಿರಾಮಂ ರಘುಕುಲತಿಲಕಂ ರಾಘವಂ ರಾವಣಾರಿಮ್ ॥","ml":"രാമം ലക്ഷ്മണപൂര്വജം രഘുവരം സീതാപതിം സുന്ദരം\nകാകുത്സ്ഥം കരുണാര്ണവം ഗുണനിധിം വിപ്രപ്രിയം ധാര്മികമ് ।\nരാജേന്ദ്രം സത്യസന്ധം ദശരഥതനയം ശ്യാമലം ശാന്തമൂര്തിം\nവന്ദേ ലോകാഭിരാമം രഘുകുലതിലകം രാഘവം രാവണാരിമ് ॥","en":"Raamam lakshmanapoorvajam raghuvaram seetaapatim sundaram\nKaakutstham karunaarnavam gunanidhim viprapriyam dhaarmikam |\nRaajendram satyasandham dasharathatanayam shyaamalam shaantamoortim\nVande lokaabhiraamam raghukulatilakam raaghavam raavanaarim ||"}],["27",{"deva":"रामाय रामभद्राय रामचन्द्राय वेधसे ।\nरघुनाथाय नाथाय सीतायाः पतये नमः ॥","ta":"ராமாய ராமபத்ராய ராமசந்த்ராய வேதஸே ।\nரகுனாதாய நாதாய ஸீதாயா: பதயே நம: ॥","te":"రామాయ రామభద్రాయ రామచన్ద్రాయ వేధసే ।\nరఘునాథాయ నాథాయ సీతాయాః పతయే నమః ॥","kn":"ರಾಮಾಯ ರಾಮಭದ್ರಾಯ ರಾಮಚನ್ದ್ರಾಯ ವೇಧಸೇ ।\nರಘುನಾಥಾಯ ನಾಥಾಯ ಸೀತಾಯಾಃ ಪತಯೇ ನಮಃ ॥","ml":"രാമായ രാമഭദ്രായ രാമചന്ദ്രായ വേധസേ ।\nരഘുനാഥായ നാഥായ സീതായാഃ പതയേ നമഃ ॥","en":"Raamaaya raamabhadraaya raamachandraaya vedhase |\nRaghunaathaaya naathaaya seetaayaah pataye namah ||"}],["28",{"deva":"श्रीराम राम रघुनन्दन राम राम\nश्रीराम राम भरताग्रज राम राम ।\nश्रीराम राम रणकर्कश राम राम\nश्रीराम राम शरणं भव राम राम ॥","ta":"ஸ்ரீராம ராம ரகுனந்தன ராம ராம\nஸ்ரீராம ராம பரதாக்ரஜ ராம ராம ।\nஸ்ரீராம ராம ரணகர்கஸ ராம ராம\nஸ்ரீராம ராம ஸரணம் பவ ராம ராம ॥","te":"శ్రీరామ రామ రఘునన్దన రామ రామ\nశ్రీరామ రామ భరతాగ్రజ రామ రామ ।\nశ్రీరామ రామ రణకర్కశ రామ రామ\nశ్రీరామ రామ శరణం భవ రామ రామ ॥","kn":"ಶ್ರೀರಾಮ ರಾಮ ರಘುನನ್ದನ ರಾಮ ರಾಮ\nಶ್ರೀರಾಮ ರಾಮ ಭರತಾಗ್ರಜ ರಾಮ ರಾಮ ।\nಶ್ರೀರಾಮ ರಾಮ ರಣಕರ್ಕಶ ರಾಮ ರಾಮ\nಶ್ರೀರಾಮ ರಾಮ ಶರಣಂ ಭವ ರಾಮ ರಾಮ ॥","ml":"ശ്രീരാമ രാമ രഘുനന്ദന രാമ രാമ\nശ്രീരാമ രാമ ഭരതാഗ്രജ രാമ രാമ ।\nശ്രീരാമ രാമ രണകര്കശ രാമ രാമ\nശ്രീരാമ രാമ ശരണം ഭവ രാമ രാമ ॥","en":"Shriraama raama raghunandana raama raama\nShriraama raama bharataagraja raama raama |\nShriraama raama ranakarkasha raama raama\nShriraama raama sharanam bhava raama raama ||"}],["29",{"deva":"श्रीरामचन्द्रचरणौ मनसा स्मरामि\nश्रीरामचन्द्रचरणौ वचसा गृणामि ।\nश्रीरामचन्द्रचरणौ शिरसा नमामि\nश्रीरामचन्द्रचरणौ शरणं प्रपद्ये ॥","ta":"ஸ்ரீராமசந்த்ரசரணௌ மனஸா ஸ்மராமி\nஸ்ரீராமசந்த்ரசரணௌ வசஸா க்ருணாமி ।\nஸ்ரீராமசந்த்ரசரணௌ ஸிரஸா நமாமி\nஸ்ரீராமசந்த்ரசரணௌ ஸரணம் ப்ரபத்யே ॥","te":"శ్రీరామచన్ద్రచరణౌ మనసా స్మరామి\nశ్రీరామచన్ద్రచరణౌ వచసా గృణామి ।\nశ్రీరామచన్ద్రచరణౌ శిరసా నమామి\nశ్రీరామచన్ద్రచరణౌ శరణం ప్రపద్యే ॥","kn":"ಶ್ರೀರಾಮಚನ್ದ್ರಚರಣೌ ಮನಸಾ ಸ್ಮರಾಮಿ\nಶ್ರೀರಾಮಚನ್ದ್ರಚರಣೌ ವಚಸಾ ಗೃಣಾಮಿ ।\nಶ್ರೀರಾಮಚನ್ದ್ರಚರಣೌ ಶಿರಸಾ ನಮಾಮಿ\nಶ್ರೀರಾಮಚನ್ದ್ರಚರಣೌ ಶರಣಂ ಪ್ರಪದ್ಯೇ ॥","ml":"ശ്രീരാമചന്ദ്രചരണൌ മനസാ സ്മരാമി\nശ്രീരാമചന്ദ്രചരണൌ വചസാ ഗൃണാമി ।\nശ്രീരാമചന്ദ്രചരണൌ ശിരസാ നമാമി\nശ്രീരാമചന്ദ്രചരണൌ ശരണം പ്രപദ്യേ ॥","en":"Shriraamachandracharanau manasaa smaraami\nShriraamachandracharanau vachasaa grinaami |\nShriraamachandracharanau shirasaa namaami\nShriraamachandracharanau sharanam prapadye ||"}],["30",{"deva":"माता रामो मत्पिता रामचन्द्रः\nस्वामी रामो मत्सखा रामचन्द्रः ।\nसर्वस्वं मे रामचन्द्रो दयालु-\nर्नान्यं जाने नैव जाने न जाने ॥","ta":"மாதா ராமோ மத்பிதா ராமசந்த்ர:\nஸ்வாமீ ராமோ மத்ஸகா ராமசந்த்ர: ।\nஸர்வஸ்வம் மே ராமசந்த்ரோ தயாலு-\nர்னான்யம் ஜானே நைவ ஜானே ந ஜானே ॥","te":"మాతా రామో మత్పితా రామచన్ద్రః\nస్వామీ రామో మత్సఖా రామచన్ద్రః ।\nసర్వస్వం మే రామచన్ద్రో దయాలు-\nర్నాన్యం జానే నైవ జానే న జానే ॥","kn":"ಮಾತಾ ರಾಮೋ ಮತ್ಪಿತಾ ರಾಮಚನ್ದ್ರಃ\nಸ್ವಾಮೀ ರಾಮೋ ಮತ್ಸಖಾ ರಾಮಚನ್ದ್ರಃ ।\nಸರ್ವಸ್ವಂ ಮೇ ರಾಮಚನ್ದ್ರೋ ದಯಾಲು-\nರ್ನಾನ್ಯಂ ಜಾನೇ ನೈವ ಜಾನೇ ನ ಜಾನೇ ॥","ml":"മാതാ രാമോ മത്പിതാ രാമചന്ദ്രഃ\nസ്വാമീ രാമോ മത്സഖാ രാമചന്ദ്രഃ ।\nസര്വസ്വം മേ രാമചന്ദ്രോ ദയാലു-\nര്നാന്യം ജാനേ നൈവ ജാനേ ന ജാനേ ॥","en":"Maataa raamo matpitaa raamachandrah\nSvaamee raamo matsakhaa raamachandrah |\nSarvasvam me raamachandro dayaalu-\nRnaanyam jaane naiva jaane na jaane ||"}],["31",{"deva":"दक्षिणे लक्ष्मणो यस्य वामे तु जनकात्मजा ।\nपुरतो मारुतिर्यस्य तं वन्दे रघुनन्दनम् ॥","ta":"தக்ஷிணே லக்ஷ்மணோ யஸ்ய வாமே து ஜனகாத்மஜா ।\nபுரதோ மாருதிர்யஸ்ய தம் வந்தே ரகுனந்தனம் ॥","te":"దక్షిణే లక్ష్మణో యస్య వామే తు జనకాత్మజా ।\nపురతో మారుతిర్యస్య తం వన్దే రఘునన్దనమ్ ॥","kn":"ದಕ್ಷಿಣೇ ಲಕ್ಷ್ಮಣೋ ಯಸ್ಯ ವಾಮೇ ತು ಜನಕಾತ್ಮಜಾ ।\nಪುರತೋ ಮಾರುತಿರ್ಯಸ್ಯ ತಂ ವನ್ದೇ ರಘುನನ್ದನಮ್ ॥","ml":"ദക്ഷിണേ ലക്ഷ്മണോ യസ്യ വാമേ തു ജനകാത്മജാ ।\nപുരതോ മാരുതിര്യസ്യ തം വന്ദേ രഘുനന്ദനമ് ॥","en":"Dakshine lakshmano yasya vaame tu janakaatmajaa |\nPurato maarutiryasya tam vande raghunandanam ||"}],["32",{"deva":"लोकाभिरामं रणरङ्गधीरं राजीवनेत्रं रघुवंशनाथम् ।\nकारुण्यरूपं करुणाकरं तं श्रीरामचन्द्रं शरणं प्रपद्ये ॥","ta":"லோகாபிராமம் ரணரங்கதீரம் ராஜீவனேத்ரம் ரகுவம்ஸனாதம் ।\nகாருண்யரூபம் கருணாகரம் தம் ஸ்ரீராமசந்த்ரம் ஸரணம் ப்ரபத்யே ॥","te":"లోకాభిరామం రణరఙ్గధీరం రాజీవనేత్రం రఘువంశనాథమ్ ।\nకారుణ్యరూపం కరుణాకరం తం శ్రీరామచన్ద్రం శరణం ప్రపద్యే ॥","kn":"ಲೋಕಾಭಿರಾಮಂ ರಣರಙ್ಗಧೀರಂ ರಾಜೀವನೇತ್ರಂ ರಘುವಂಶನಾಥಮ್ ।\nಕಾರುಣ್ಯರೂಪಂ ಕರುಣಾಕರಂ ತಂ ಶ್ರೀರಾಮಚನ್ದ್ರಂ ಶರಣಂ ಪ್ರಪದ್ಯೇ ॥","ml":"ലോകാഭിരാമം രണരങ്ഗധീരം രാജീവനേത്രം രഘുവംശനാഥമ് ।\nകാരുണ്യരൂപം കരുണാകരം തം ശ്രീരാമചന്ദ്രം ശരണം പ്രപദ്യേ ॥","en":"Lokaabhiraamam ranarangadheeram raajeevanetram raghuvamshanaatham |\nKaarunyaroopam karunaakaram tam shriraamachandram sharanam prapadye ||"}],["33",{"deva":"मनोजवं मारुततुल्यवेगं जितेन्द्रियं बुद्धिमतां वरिष्ठम् ।\nवातात्मजं वानरयूथमुख्यं श्रीरामदूतं शरणं प्रपद्ये ॥","ta":"மனோஜவம் மாருததுல்யவேகம் ஜிதேந்த்ரியம் புத்திமதாம் வரிஷ்டம் ।\nவாதாத்மஜம் வானரயூதமுக்யம் ஸ்ரீராமதூதம் ஸரணம் ப்ரபத்யே ॥","te":"మనోజవం మారుతతుల్యవేగం జితేన్ద్రియం బుద్ధిమతాం వరిష్ఠమ్ ।\nవాతాత్మజం వానరయూథముఖ్యం శ్రీరామదూతం శరణం ప్రపద్యే ॥","kn":"ಮನೋಜವಂ ಮಾರುತತುಲ್ಯವೇಗಂ ಜಿತೇನ್ದ್ರಿಯಂ ಬುದ್ಧಿಮತಾಂ ವರಿಷ್ಠಮ್ ।\nವಾತಾತ್ಮಜಂ ವಾನರಯೂಥಮುಖ್ಯಂ ಶ್ರೀರಾಮದೂತಂ ಶರಣಂ ಪ್ರಪದ್ಯೇ ॥","ml":"മനോജവം മാരുതതുല്യവേഗം ജിതേന്ദ്രിയം ബുദ്ധിമതാം വരിഷ്ഠമ് ।\nവാതാത്മജം വാനരയൂഥമുഖ്യം ശ്രീരാമദൂതം ശരണം പ്രപദ്യേ ॥","en":"Manojavam maarutatulyavegam jitendriyam buddhimataam varishtham |\nVaataatmajam vaanarayoothamukhyam shriraamadootam sharanam prapadye ||"}],["34",{"deva":"कूजन्तं रामरामेति मधुरं मधुराक्षरम् ।\nआरुह्य कविताशाखां वन्दे वाल्मीकिकोकिलम् ॥","ta":"கூஜந்தம் ராமராமேதி மதுரம் மதுராக்ஷரம் ।\nஆருஹ்ய கவிதாஸாகாம் வந்தே வால்மீகிகோகிலம் ॥","te":"కూజన్తం రామరామేతి మధురం మధురాక్షరమ్ ।\nఆరుహ్య కవితాశాఖాం వన్దే వాల్మీకికోకిలమ్ ॥","kn":"ಕೂಜನ್ತಂ ರಾಮರಾಮೇತಿ ಮಧುರಂ ಮಧುರಾಕ್ಷರಮ್ ।\nಆರುಹ್ಯ ಕವಿತಾಶಾಖಾಂ ವನ್ದೇ ವಾಲ್ಮೀಕಿಕೋಕಿಲಮ್ ॥","ml":"കൂജന്തം രാമരാമേതി മധുരം മധുരാക്ഷരമ് ।\nആരുഹ്യ കവിതാശാഖാം വന്ദേ വാല്മീകികോകിലമ് ॥","en":"Koojantam raamaraameti madhuram madhuraaksharam |\nAaruhya kavitaashaakhaam vande vaalmeekikokilam ||"}],["35",{"deva":"आपदामपहर्तारं दातारं सर्वसम्पदाम् ।\nलोकाभिरामं श्रीरामं भूयो भूयो नमाम्यहम् ॥","ta":"ஆபதாமபஹர்தாரம் தாதாரம் ஸர்வஸம்பதாம் ।\nலோகாபிராமம் ஸ்ரீராமம் பூயோ பூயோ நமாம்யஹம் ॥","te":"ఆపదామపహర్తారం దాతారం సర్వసమ్పదామ్ ।\nలోకాభిరామం శ్రీరామం భూయో భూయో నమామ్యహమ్ ॥","kn":"ಆಪದಾಮಪಹರ್ತಾರಂ ದಾತಾರಂ ಸರ್ವಸಮ್ಪದಾಮ್ ।\nಲೋಕಾಭಿರಾಮಂ ಶ್ರೀರಾಮಂ ಭೂಯೋ ಭೂಯೋ ನಮಾಮ್ಯಹಮ್ ॥","ml":"ആപദാമപഹര്താരം ദാതാരം സര്വസമ്പദാമ് ।\nലോകാഭിരാമം ശ്രീരാമം ഭൂയോ ഭൂയോ നമാമ്യഹമ് ॥","en":"Aapadaamapahartaaram daataaram sarvasampadaam |\nLokaabhiraamam shriraamam bhooyo bhooyo namaamyaham ||"}],["36",{"deva":"भर्जनं भवबीजानामर्जनं सुखसम्पदाम् ।\nतर्जनं यमदूतानां रामरामेति गर्जनम् ॥","ta":"பர்ஜனம் பவபீஜானாமர்ஜனம் ஸுகஸம்பதாம் ।\nதர்ஜனம் யமதூதானாம் ராமராமேதி கர்ஜனம் ॥","te":"భర్జనం భవబీజానామర్జనం సుఖసమ్పదామ్ ।\nతర్జనం యమదూతానాం రామరామేతి గర్జనమ్ ॥","kn":"ಭರ್ಜನಂ ಭವಬೀಜಾನಾಮರ್ಜನಂ ಸುಖಸಮ್ಪದಾಮ್ ।\nತರ್ಜನಂ ಯಮದೂತಾನಾಂ ರಾಮರಾಮೇತಿ ಗರ್ಜನಮ್ ॥","ml":"ഭര്ജനം ഭവബീജാനാമര്ജനം സുഖസമ്പദാമ് ।\nതര്ജനം യമദൂതാനാം രാമരാമേതി ഗര്ജനമ് ॥","en":"Bharjanam bhavabeejaanaamarjanam sukhasampadaam |\nTarjanam yamadootaanaam raamaraameti garjanam ||"}],["37",{"deva":"रामो राजमणिः सदा विजयते रामं रमेशं भजे\nरामेणाभिहता निशाचरचमू रामाय तस्मै नमः ।\nरामान्नास्ति परायणं परतरं रामस्य दासोऽस्म्यहं\nरामे चित्तलयः सदा भवतु मे भो राम मामुद्धर ॥","ta":"ராமோ ராஜமணி: ஸதா விஜயதே ராமம் ரமேஸம் பஜே\nராமேணாபிஹதா நிஸாசரசமூ ராமாய தஸ்மை நம: ।\nராமாந்னாஸ்தி பராயணம் பரதரம் ராமஸ்ய தாஸோஸ்ம்யஹம்\nராமே சித்தலய: ஸதா பவது மே போ ராம மாமுத்தர ॥","te":"రామో రాజమణిః సదా విజయతే రామం రమేశం భజే\nరామేణాభిహతా నిశాచరచమూ రామాయ తస్మై నమః ।\nరామాన్నాస్తి పరాయణం పరతరం రామస్య దాసోఽస్మ్యహం\nరామే చిత్తలయః సదా భవతు మే భో రామ మాముద్ధర ॥","kn":"ರಾಮೋ ರಾಜಮಣಿಃ ಸದಾ ವಿಜಯತೇ ರಾಮಂ ರಮೇಶಂ ಭಜೇ\nರಾಮೇಣಾಭಿಹತಾ ನಿಶಾಚರಚಮೂ ರಾಮಾಯ ತಸ್ಮೈ ನಮಃ ।\nರಾಮಾನ್ನಾಸ್ತಿ ಪರಾಯಣಂ ಪರತರಂ ರಾಮಸ್ಯ ದಾಸೋಽಸ್ಮ್ಯಹಂ\nರಾಮೇ ಚಿತ್ತಲಯಃ ಸದಾ ಭವತು ಮೇ ಭೋ ರಾಮ ಮಾಮುದ್ಧರ ॥","ml":"രാമോ രാജമണിഃ സദാ വിജയതേ രാമം രമേശം ഭജേ\nരാമേണാഭിഹതാ നിശാചരചമൂ രാമായ തസ്മൈ നമഃ ।\nരാമാന്നാസ്തി പരായണം പരതരം രാമസ്യ ദാസോഽസ്മ്യഹം\nരാമേ ചിത്തലയഃ സദാ ഭവതു മേ ഭോ രാമ മാമുദ്ധര ॥","en":"Raamo raajamanih sadaa vijayate raamam ramesham bhaje\nRaamenaabhihataa nishaacharachamoo raamaaya tasmai namah |\nRaamaannaasti paraayanam parataram raamasya daaso'smyaham\nRaame chittalayah sadaa bhavatu me bho raama maamuddhara ||"}],["38",{"deva":"श्रीराम राम रामेति रमे रामे मनोरमे ।\nसहस्रनाम तत्तुल्यं रामनाम वरानने ॥","ta":"ஸ்ரீராம ராம ராமேதி ரமே ராமே மனோரமே ।\nஸஹஸ்ரனாம தத்துல்யம் ராமனாம வரானனே ॥","te":"శ్రీరామ రామ రామేతి రమే రామే మనోరమే ।\nసహస్రనామ తత్తుల్యం రామనామ వరాననే ॥","kn":"ಶ್ರೀರಾಮ ರಾಮ ರಾಮೇತಿ ರಮೇ ರಾಮೇ ಮನೋರಮೇ ।\nಸಹಸ್ರನಾಮ ತತ್ತುಲ್ಯಂ ರಾಮನಾಮ ವರಾನನೇ ॥","ml":"ശ്രീരാമ രാമ രാമേതി രമേ രാമേ മനോരമേ ।\nസഹസ്രനാമ തത്തുല്യം രാമനാമ വരാനനേ ॥","en":"Shriraama raama raameti rame raame manorame |\nSahasranaama tattulyam raamanaama varaanane ||"}],["",{"deva":"इति श्रीबुधकौशिकविरचितं श्रीरामरक्षास्तोत्रं सम्पूर्णम् ।\nश्रीसीतारामचन्द्रार्पणमस्तु ॥","ta":"இதி ஸ்ரீபுதகௌஸிகவிரசிதம் ஸ்ரீராமரக்ஷாஸ்தோத்ரம் ஸம்பூர்ணம் ।\nஸ்ரீஸீதாராமசந்த்ரார்பணமஸ்து ॥","te":"ఇతి శ్రీబుధకౌశికవిరచితం శ్రీరామరక్షాస్తోత్రం సమ్పూర్ణమ్ ।\nశ్రీసీతారామచన్ద్రార్ప const MAXF=8, MAXB=5*1024*1024;
function readFile(f){ return new Promise((res,rej)=>{
  if(f.type.startsWith("image/")){ const img=new Image(), url=URL.createObjectURL(f);
    img.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const d=c.toDataURL("image/jpeg",.78);
      res({name:f.name.replace(/\.\w+$/,"")+".jpg",type:"image/jpeg",data:d.split(",")[1],size:Math.round(d.length*.75),preview:d});};
    img.onerror=()=>rej(); img.src=url; }
  else { if(f.size>MAXB) return rej("big"); const r=new FileReader(); r.onload=()=>res({name:f.name,type:f.type||(/\.docx$/i.test(f.name)?"application/vnd.openxmlformats-officedocument.wordprocessingml.document":/\.doc$/i.test(f.name)?"application/msword":"application/pdf"),data:String(r.result).split(",")[1],size:f.size}); r.onerror=()=>rej(); r.readAsDataURL(f); }
});}

function searchAll(q){
  const w0=q.toLowerCase().replace(/[.,()]/g," ").split(/\s+/).filter(x=>x.length>1); if(!w0.length) return [];
  const extra=[]; w0.forEach(z=>{const y=(typeof SYN!=="undefined")&&SYN[z]; if(y) y.split(" ").forEach(v=>{ if(!w0.includes(v)) extra.push(v); });});
  const w=w0.concat(extra.slice(0,6));
  const out=[];
  AREAS.forEach(a=>a.items.forEach(it=>{const x=tr()&&tr().P[it.id]||{};
    const hay=(it.n+" "+it.s+" "+(it.k||"")+" "+a.n+" "+(x.n||"")+" "+(x.s||"")+" "+aN(a)).toLowerCase(), body=((it.st||[]).join(" ")+" "+(x.st||[]).join(" ")).toLowerCase();
    let sc=0; w.forEach(z=>{if(hay.includes(z))sc+=3; else if(body.includes(z))sc+=1;}); if(sc) out.push({sc,type:"p",a,it});}));
  Object.entries(ACTS).forEach(([k,A])=>A.s.forEach(([s,m])=>{const hay=(A.n+" "+s+" "+m).toLowerCase(); let sc=0; w.forEach(z=>{if(hay.includes(z))sc+=2;}); if(sc>=2*Math.min(w0.length,2)||(w0.length===1&&sc)) out.push({sc:sc-0.5,type:"s",k,s,m,A});}));
  if(userType()!=="Citizen") STAGES.forEach(s=>{const hay=(s.n+" "+s.g+" "+s.kw.join(" ")).toLowerCase(); let sc=0; w.forEach(z=>{if(hay.includes(z))sc+=2;}); if(sc) out.push({sc,type:"h",s});});
  return out.sort((x,y)=>y.sc-x.sc).slice(0,40);
}
const FEAT=[["urgent","urgent","urgent filing emergency bail arrest stay lunch motion writ petition crl op crp high court file quick அவசர தாக்கல் ஜாமீன் கைது तत्काल ज़मानत गिरफ़्तारी"],

function searchExtra(q){
  const z=q.toLowerCase().trim(); if(z.length<2) return {f:[],h:[],m:[]};
  const ws=z.split(/\s+/);
  const f=FEAT.filter(x=>allowed(x[0])&&ws.some(w=>x[2].includes(w)||ql(x[1]).toLowerCase().includes(w)));
  const seen=new Set(); const h=HELP.flatMap(g=>g.n).filter(r=>!seen.has(r[0])&&(r[0].includes(z.replace(/\D/g,"")||"#")||ws.every(w=>r.slice(1).join(" ").toLowerCase().includes(w)))&&seen.add(r[0])).slice(0,6);
  const m=MANTRAS.filter(x=>ws.every(w=>[x.t.en,x.t.ta,x.t.hi,x.id].join(" ").toLowerCase().includes(w))).slice(0,6);
  return {f,h,m};
}

  const run=()=>{S.q=q.value; qc.hidden=!S.q; const r=searchAll(S.q), ex=searchExtra(S.q);
    const none=!r.length&&!ex.f.length&&!ex.h.length&&!ex.m.length;
    const feat=ex.f.map(x=>`<button class="row sfeat ${x[0]==="urgent"?"surg":""}" data-go="${x[0]}"><span><b>${esc(ql(x[1]))}</b></span><span class="chev">›</span></button>`).join("");

    res.innerHTML=!S.q.trim()?`<p class="note">${t("searchHelp")}</p>`:none?`<p class="lead">${t("noMatch")}</p><button class="btn" id="tx">${t("talkAdv")}</button><button class="btn urgbtn" id="tu">🚨 ${esc(ql("urgent"))}</button>`:
      feat+r.map((x,i)=>x.type==="h"?`<button class="row" data-r="${i}"><span><b>${esc(x.s.n)}</b><small>${t("hearTitle")} · ${esc(x.s.g)}</small></span><span class="chev">›</span></button>`:x.type==="p"?`<button class="row" data-r="${i}"><span><b>${esc(pT(x.it,"n"))}</b><small>${esc(aN(x.a))} · ${esc(pT(x.it,"s"))}</small></span><span class="chev">›</span></button>`
        :`<button class="lawrow" data-r="${i}"><b>${esc(x.s)} – ${esc(x.A.n)}</b><span>${esc(x.m)}</span></button>`).join("")+hel+man;
    res.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const x=r[b.dataset.r]; if(x.type==="h"){S.stage=x.s.id;S.stageFrom=null;go("stage")} else if(x.type==="p"){S.area=x.a;S.item=x.it;S.ans={};S.files=[];go("problem")} else {S.act=x.k;S.actSec=x.s;go("act")}});
    res.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
    res.querySelectorAll("[data-mid]").forEach(b=>b.onclick=()=>{S.mid=b.dataset.mid;go("mantra")});
    const tx=$("#tx"); if(tx) tx.onclick=()=>go("expert"); const tu=$("#tu"); if(tu) tu.onclick=()=>go("urgent");};
  let st=null; q.oninput=()=>{run(); clearTimeout(st); st=setTimeout(()=>{ if(q.value.trim().length>1) track("search",q.value.trim()); },1500);};
  q.onkeydown=e=>{if(e.key==="Enter"){q.blur();}};
  qc.onclick=()=>{q.value="";run();q.focus();};
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{q.value=b.dataset.s;run()}); run();
  if(!S.q) setTimeout(()=>{try{q.focus()}catch(e){}},80);
};

async function pinHash(phone,pin){ try{ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("nj:"+phone+":"+pin)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){ let h=0; for(const c of phone+pin) h=(h*31+c.charCodeAt(0))|0; return String(h); } }
function pinBox(id){ return `<input id="${id}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="otpin" autocomplete="off">`; }
/* accounts kept on this phone (used only until the office server link is set in config.js) */
const ACC={all:()=>store.get("accounts")||{}, get:ph=>ACC.all()[ph], put:(ph,a)=>{const m=ACC.all();m[ph]=a;store.set("accounts",m);}};
(function(){ const k=store.get("known"); if(k&&k.local&&k.phone&&!ACC.get(k.phone)) ACC.put(k.phone,{name:k.name,profile:k.profile,pin:k.pin}); })();
const dobKey=d=>String(d||"").trim();
function pinField(id,label,hint){ return `<label>${label}${hint?`<span class="hint">${hint}</span>`:""}${pinBox(id)}</label>`; }
function phoneField(id,val){ return `<label>${t("mobile")}<input id="${id}" type="tel" inputmode="numeric" maxlength="10" pattern="[0-9]*" value="${esc(val||"")}" placeholder="${t("digits")}" autocomplete="tel-national"></label>`; }

/* Hearing guide: several eCourts photos -> history-aware guidance */
async function scanMany(files,out){
  const texts=[]; let i=0;
  for(const f of files.slice(0,6)){ i++; out.innerHTML=`<div class="msg ok">${t("reading")} ${i}/${Math.min(files.length,6)} – <span id="pg">0</span>%</div>`;
    try{ texts.push(await readStagePhoto(f,p=>{const e=$("#pg");if(e)e.textContent=p;})); }catch(e){ if(i===1) throw e; } }
  const all=texts.join("\n"), r=detectStage(all);
  const purposes=(all.match(/(?:purpose|stage|business)[^\n]{0,15}[:\-]?\s*([^\n]{3,40})/gi)||[]).map(x=>x.replace(/^(?:purpose|stage|business)[^:\-]*[:\-]?\s*/i,"").trim().toLowerCase());
  const counts={}; STAGES.forEach(s=>{const n=purposes.filter(p=>s.kw.some(k=>(" "+p+" ").includes(k))).length; if(n) counts[s.id]=n;});
  const top=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  return {r,counts,top,purposes,text:all};
}

const NJ_AI_RULES="You are NJ AI, the legal information assistant inside the NJ Legal Solutions app (M/s. Neeraj & Associates, Chennai). Answer about Indian law clearly and practically in the same language as the user (English, Tamil or Hindi). Use the criminal laws in force from 1 July 2024 – BNS, BNSS, BSA – with the old IPC/CrPC/Evidence Act section in brackets when helpful, and Tamil Nadu / Madras High Court practice where relevant. Structure: short headings and numbered steps – what it means, what to do now, what to file, time limits, sections of law. If photos of eCourts case status / case history, cause lists, notices or court papers are attached, first read them (case number, court, stage, purpose, past dates, repeated adjournments) and then say exactly what to do at today's hearing, what to file, how to seek time properly if not ready (adjournment petition, costs, limits) and what to tell the client. Never invent judgments or citations; say when something must be checked. Do not advertise any advocate. End with: General information only – please verify before acting.";
let SAMPLE=undefined;
async function viewerAI(hist,files,live){
  if(SAMPLE===undefined){ SAMPLE=null; try{ if(window.claude&&claude.use) SAMPLE=await claude.use("sample"); }catch(e){} }
  if(!SAMPLE) return null;
  const turns=hist.map((m,i)=>({role:m.role==="assistant"?"assistant":"user",content:String(m.text)}));
  while(turns.length&&turns[0].role!=="user") turns.shift();
  if(!turns.length) return null;
  turns[0].content=NJ_AI_RULES+"\nUser language code: "+(LANG||"en")+". Today is "+fmtD(todayISO())+".\n\n"+turns[0].content;
  const opts={cache:false,onText:({text})=>live(text)};
  if(files.length){ try{ const L=await SAMPLE.limits(); if(L&&L.images) opts.images=files.map(f=>{const bin=atob(f.data),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:f.type});}); }catch(e){} }
  try{ const r=await SAMPLE(turns,opts); track("ai_question",(hist[hist.length-1]||{}).text||""); return r.text; }
  catch(e){ if(e&&e.code==="not_granted") throw {error:t("aiAllow")}; throw {error:t("aiBusy")}; }
}

const iso=d=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());};
const todayISO=()=>iso(new Date()); const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return iso(d);};

const saveLocal=()=>store.set("cases",CASES);
function syncCases(){ if(!hasBackend()||!S.user||S.user.token==="local") return Promise.resolve();
  return api("cases",{token:S.user.token}).then(r=>{ if(r.items){ CASES=r.items; saveLocal(); } }).catch(()=>{}); }
function putCase(c){ c.updated=Date.now(); const i=CASES.findIndex(x=>x.id===c.id); if(i>=0)CASES[i]=c; else CASES.push(c); saveLocal();
  if(hasBackend()&&S.user&&S.user.token!=="local") api("saveCase",{token:S.user.token,item:c}).catch(()=>{}); }
function delCase(id){ CASES=CASES.filter(x=>x.id!==id); saveLocal(); if(hasBackend()&&S.user&&S.user.token!=="local") api("deleteCase",{token:S.user.token,id}).catch(()=>{}); }
const casesOn=d=>CASES.filter(c=>c.next===d);
const stageOf=c=>{ if(!c.stage) return null; const r=detectStage("stage: "+c.stage); return r.ranked[0]||null; };
function icsFor(c){
  const d=c.next.replace(/-/g,""), z=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const tx=s=>String(s||"").replace(/[,;]/g,"\\$&").replace(/\n/g,"\\n");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//NJ Legal Solutions//Case Diary//EN","BEGIN:VEVENT","UID:"+c.id+"-"+d+"@nj","DTSTAMP:"+z,
   "DTSTART:"+d+"T103000","DTEND:"+d+"T113000","SUMMARY:"+tx("Hearing: "+c.no+" – "+(c.stage||"")),"LOCATION:"+tx(c.court+(c.district?", "+c.district:"")),
   "DESCRIPTION:"+tx((c.parties||"")+"\nStage: "+(c.stage||"")+"\n"+(c.notes||"")),
   "BEGIN:VALARM","TRIGGER:-PT15H","ACTION:DISPLAY","DESCRIPTION:Tomorrow hearing "+tx(c.no),"END:VALARM",
   "BEGIN:VALARM","TRIGGER:-PT2H","ACTION:DISPLAY","DESCRIPTION:Today hearing "+tx(c.no),"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function downloadICS(c){ const a=document.createElement("a"); a.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(icsFor(c)); a.download=(c.no||"hearing").replace(/[^\w]+/g,"_")+".ics"; document.body.appendChild(a); a.click(); a.remove(); track("calendar_add",c.no); }

/* Reminders: on opening the app (and through the phone calendar) */
function remindNow(){
  const td=casesOn(todayISO()), tm=casesOn(addDays(todayISO(),1));
  if(!(td.length||tm.length)) return;
  try{ if("Notification" in window && Notification.permission==="granted" && store.get("lastNotify")!==todayISO()){
      const body=td.length?td.map(c=>c.no+" – "+(c.stage||"hearing")).join("\n"):tm.map(c=>"Tomorrow: "+c.no+" – "+(c.stage||"hearing")).join("\n");
      new Notification(td.length?t("todayCases",{n:td.length}):t("tomorrowCases",{n:tm.length}),{body,icon:"icon-192.png"}); store.set("lastNotify",todayISO()); } }catch(e){}
}

function toISO(s){ if(!s) return ""; const m=s.match(/(\d{1,2})(?:st|nd|rd|th)?[\s\-./]+([A-Za-z]{3,9}|\d{1,2})[\s\-./,]+(\d{2,4})/); if(!m) return "";
  let mo=isNaN(m[2])?MONTHS.findIndex(x=>x.toLowerCase().startsWith(m[2].toLowerCase().slice(0,3)))+1:+m[2]; let yr=+m[3]; if(yr<100)yr+=2000;
  if(mo<1) return ""; return iso(new Date(yr,mo-1,+m[1])); }
function parseCaseText(tx){
  const f=(re)=>{const m=tx.match(re);return m?m[1].trim():"";};
  const r=detectStage(tx);
  const no=f(/(?:case\s*(?:type|no\.?|number)|registration\s*number|filing\s*number)\s*[:\-]?\s*([^\n]{3,50})/i)||f(/\b((?:O\.?S|W\.?P|C\.?C|S\.?C|C\.?R\.?P|E\.?P|M\.?C\.?O\.?P|H\.?M\.?O\.?P|Crl\.?\s*O\.?P|C\.?M\.?A|A\.?S)\.?\s*(?:No\.?)?\s*\d+\s*(?:of|\/)\s*\d{4})/i);
  return {no, court:f(/court\s*(?:number\s*and\s*judge|name|establishment)?\s*[:\-]\s*([^\n]{3,80})/i), stage:r.line|| (r.ranked[0]?r.ranked[0].n:""), next:toISO(r.next)};
}

  const body=MGROUPS.map(g=>{const ms=MANTRAS.filter(m=>m.g===g.id&&hit(m)); if(!ms.length) return "";

  <label class="msearch">${IC.search}<input id="mq" type="search" placeholder="${mt("find")}" value="${esc(S.mq||"")}" autocomplete="off"></label>

  app.querySelectorAll("[data-mid]").forEach(b=>b.onclick=()=>{S.mid=b.dataset.mid; go("mantra");});

function mDefaultScript(m){
  const saved=store.get("mscript"); if(saved&&m.s.includes(saved)) return saved;
  const want={ta:"ta",hi:"deva"}[LANG||"en"];
  return want&&m.s.includes(want)?want:m.s[0];
}

      <label class="msel"><span>${mt("speed")}</span><select id="mrt">${[.7,.85,1,1.15].map(r=>`<option value="${r}" ${r==MREAD.rate?"selected":""}>${r}×</option>`).join("")}</select></label>

    </div>
    <div class="mstat" id="mstat" aria-live="polite">${esc(MREAD.note)}</div>
  </div>`;
  $("#mb").onclick=()=>{mStop();back();};
  $("#msm").onclick=()=>{MREAD.size=Math.max(.75,+(MREAD.size-.1).toFixed(2));store.set("msize",MREAD.size);$("#mtext").style.setProperty("--ms",MREAD.size);};
  $("#mbg").onclick=()=>{MREAD.size=Math.min(1.9,+(MREAD.size+.1).toFixed(2));store.set("msize",MREAD.size);$("#mtext").style.setProperty("--ms",MREAD.size);};
  $("#mdk").onclick=()=>{MREAD.dark=!MREAD.dark;store.set("mdark",MREAD.dark);document.body.classList.toggle("mdark",MREAD.dark);$("#mdk").textContent=MREAD.dark?"☀":"☾";};
  app.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{const was=MREAD.playing&&!MREAD.paused; mStop(true); MREAD.script=b.dataset.sc; store.set("mscript",MREAD.script); V.mantra(); if(was) mPlay();});
  $("#mpl").onclick=()=>{ if(MREAD.playing&&!MREAD.paused){MREAD.paused=true;try{speechSynthesis.cancel()}catch(e){} mBtn();} else if(MREAD.paused){MREAD.paused=false;mSpeak();mBtn();} else mPlay(); };
  $("#mst").onclick=()=>mStop();
  $("#mrt").onchange=e=>{MREAD.rate=+e.target.value;store.set("mrate",MREAD.rate); if(MREAD.playing&&!MREAD.paused){try{speechSynthesis.cancel()}catch(e){} setTimeout(mSpeak,60);}};
  $("#mtm").onchange=e=>{MREAD.times=+e.target.value;};
  app.querySelectorAll(".mv").forEach(el=>el.ondblclick=()=>{MREAD.idx=+el.dataset.i; if(MREAD.playing){try{speechSynthesis.cancel()}catch(e){} MREAD.paused=false; setTimeout(mSpeak,60);}});

const LABS={"दोहा":{deva:"दोहा",ta:"தோஹா",te:"దోహా",kn:"ದೋಹಾ",ml:"ദോഹാ",en:"Doha"}};
const mLab=(l,sc)=>LABS[l]?(LABS[l][sc]||LABS[l].en):l;
function mBtn(){const b=$("#mpl"); if(b) b.textContent=MREAD.playing&&!MREAD.paused?"❚❚ "+mt("pause"):MREAD.paused?"▶ "+mt("resume"):"▶ "+mt("listen");}
function mMark(scroll){app.querySelectorAll(".mv").forEach(el=>el.classList.toggle("on",MREAD.playing&&+el.dataset.i===MREAD.idx));
  const el=app.querySelector('.mv[data-i="'+MREAD.idx+'"]'); if(scroll&&el&&MREAD.playing) el.scrollIntoView({behavior:"smooth",block:"center"});}
function mStat(x){MREAD.note=x||""; const s=$("#mstat"); if(s) s.textContent=MREAD.note;}
/* the best voice the phone has for a language: Siri/Enhanced/Premium/Neural/Google voices first */
function bestVoice(code){
  let vs=[]; try{vs=speechSynthesis.getVoices()||[]}catch(e){}
  const c=code.toLowerCase();
  const list=vs.filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith(c));
  if(!list.length) return null;
  const score=v=>{const n=v.name||""; let s=0;
    if(/premium|enhanced|neural|natural|siri/i.test(n)) s+=10; if(/google/i.test(n)) s+=6;
    if(c==="en"&&/-IN|India/i.test(v.lang+" "+n)) s+=5; if(c==="ar"&&/SA/i.test(v.lang)) s+=1;
    if(/compact|eloquence|espeak/i.test(n)) s-=8; if(v.localService) s+=1; return s;};
  return list.sort((a,b)=>score(b)-score(a))[0];
}
function mClean(s){return s.replace(/\s*[।॥|]+\s*/g,", ").replace(/[0-9०-९]+/g," ").replace(/[–—-]\s*$/gm,"").replace(/\n/g,", ").replace(/\s*(,\s*)+/g,", ").replace(/\s+/g," ").replace(/^[,\s]+|[,\s]+$/g,"").trim();}
function mPlay(){ if(!("speechSynthesis" in window)){mStat(mt("novoice2"));return;}
  MREAD.playing=true; MREAD.paused=false; MREAD.idx=0; MREAD.round=1; mBtn(); wakeOn(); mSpeak(); }
function mStop(keepNote){ MREAD.playing=false; MREAD.paused=false; MREAD.idx=0; MREAD.round=1; try{speechSynthesis.cancel()}catch(e){} mBtn(); mMark(); if(!keepNote) mStat(""); }
function mSpeak(){
  const m=MANTRAS.find(x=>x.id===MREAD.id); if(!m||!MREAD.playing||MREAD.paused) return;
  if(MREAD.idx>=m.v.length){ if(MREAD.round<MREAD.times){MREAD.round++;MREAD.idx=0;} else {mStop(true);return;} }
  let sc=MREAD.script, v=bestVoice(SCR_VOICE[sc]), note="";
  if(!v){ const alt=m.s.includes("deva")&&bestVoice("hi")?"deva":(m.s.includes("en")&&bestVoice("en")?"en":null);
    if(alt){sc=alt; v=bestVoice(SCR_VOICE[alt]); note=alt==="deva"?mt("novoice"):"";} else {mStat(mt("novoice2")); mStop(true); return;} }
  const text=mClean(m.v[MREAD.idx][1][sc]);
  const u=new SpeechSynthesisUtterance(text||" ");
  u.voice=v; u.lang=v.lang; u.rate=MREAD.rate; u.pitch=1;
  const my=MREAD.idx, tok=MREAD.tok=(MREAD.tok||0)+1;
  u.onend=()=>{ if(!MREAD.playing||MREAD.paused||MREAD.idx!==my||MREAD.tok!==tok) return; MREAD.idx++; setTimeout(mSpeak,sc==="en"?220:380); };
  u.onerror=e=>{ if(MREAD.tok!==tok||!MREAD.playing||MREAD.paused||(e&&(e.error==="interrupted"||e.error==="canceled"))) return; MREAD.idx++; setTimeout(mSpeak,200); };
  mStat((note?note+" · ":"")+mt("voice")+": "+(v.name||v.lang)+(MREAD.times>1?" · "+mt("count")+" "+MREAD.round+"/"+MREAD.times:""));
  mMark(true);
  try{ speechSynthesis.cancel(); }catch(e){}
  setTimeout(()=>{ try{speechSynthesis.speak(u);}catch(e){} },30);
}

const hcWk=d=>{const g=new Date(d+"T00:00:00").getDay(); return g===0||g===6;};
/* kind of a date: "hol" | "vac" | "wk" | "work" | null (year not published) */
function hcKind(d){ if(HC_HOL[d]) return "hol"; if(!HC_YEARS.includes(+d.slice(0,4))) return null; if(hcVac(d)) return "vac"; if(hcWk(d)) return "wk"; return "work"; }
function hcLabel(d){ const k=hcKind(d); if(k==="hol") return "🔴 "+HC_HOL[d]; if(k==="vac") return "🟡 "+hcVac(d)[2]; if(k==="wk") return "⚪ "+ht("wk"); if(k==="work") return "🟢 "+ht("work"); return ""; }
function hcMonthStats(y,m){ let w=0,h=0; const n=new Date(y,m+1,0).getDate();
  for(let i=1;i<=n;i++){const d=iso(new Date(y,m,i)), k=hcKind(d); if(k==="work") w++; else if(k==="hol"&&!hcWk(d)&&!hcVac(d)) h++;} return {w,h}; }
V.hccal=()=>{
  const y=S.hcY||(HC_YEARS.includes(new Date().getFullYear())?new Date().getFullYear():HC_YEARS[HC_YEARS.length-1]); S.hcY=y;

  const nextH=Object.keys(HC_HOL).sort().find(d=>d>td&&!hcWk(d));
  let total=0; const months=[...Array(12).keys()].map(m=>{const st=hcMonthStats(y,m); total+=st.w;
    const hs=Object.keys(HC_HOL).filter(d=>d.startsWith(y+"-"+String(m+1).padStart(2,"0"))).sort();
    const vs=HC_VAC.filter(v=>v[0].slice(0,7)===y+"-"+String(m+1).padStart(2,"0"));

     ${vs.map(v=>`<div class="hcrow vac"><span class="hcd">${fmtD(v[0]).slice(0,5)} – ${fmtD(v[1]).slice(0,5)}</span><span>${esc(v[2])}</span></div>`).join("")}

  app.innerHTML=`${backBtn()}<div class="list" style="gap:4px"><span class="crumb">High Court of Madras</span><h2>${ht("title")} ${y}</h2></div>
   <div class="grid"><button class="btn small ghost" id="hpy">← ${y-1}</button><button class="btn small ghost" id="hny">${y+1} →</button></div>

const ut=k=>(UT[k]||{})[LANG||"en"]||(UT[k]||{}).en||k;
function urgInit(){ if(!S.urg) S.urg=store.get("urg")||{who:userType()==="Advocate"?"adv":"party",court:UCOURTS[0],place:"",type:"",when:"today",facts:"",ref:"",parties:"",enr:"",city:""}; }
const urgSave=()=>store.set("urg",S.urg);
function urgText(){urgInit(); const u=S.urg,c=S.contact;
  return ["🚨 URGENT FILING REQUEST – NJ Legal Solutions","",
   "From: "+(c.name||"")+" ("+(u.who==="adv"?"Advocate"+(u.enr?", Enr. "+u.enr:""):"Party")+")","Mobile: "+(c.phone||""),u.city?"Place: "+u.city:"",
   "Court: "+u.court+(u.place?" – "+u.place:""),"To file: "+u.type,"Urgency: "+(UWHEN.find(w=>w[0]===u.when)||[0,""])[1],
   u.parties?"Parties: "+u.parties:"",u.ref?"Case / FIR / Order: "+u.ref:"","","Facts and relief:",u.facts,"",
   S.files.length?"Documents: "+S.files.length+" attached":"","Please call me back."].filter((x,i,a)=>x!==""||a[i-1]!=="").join("\n");}
V.urgent=()=>{
  urgInit(); const u=S.urg, c=S.contact; if(S.user){c.name=c.name||S.user.name;c.phone=c.phone||S.user.phone;}
  app.innerHTML=`${backBtn()}
  <div class="uhero"><div class="usiren" aria-hidden="true">🚨</div><div><h2>${ut("title")}</h2><p>${ut("sub")}</p></div></div>
  <p class="lead">${ut("lead")}</p>
  <a class="btn ucall" href="tel:+91${CONFIG.PHONE.replace(/\D/g,"")}" data-trk="urgent_call">${IC.call} ${ut("callNow")} · ${CONFIG.PHONE}</a>
  <section class="card">
   <div class="list" style="gap:8px"><label style="gap:2px">${ut("iam")}</label><div class="chips">${[["adv",ut("adv")],["party",ut("party")]].map(([k,n])=>`<button type="button" class="chip" data-who="${k}" aria-pressed="${u.who===k}">${n}</button>`).join("")}</div></div>
   <label>${ut("court")}<select data-u="court">${UCOURTS.map(x=>`<option ${x===u.court?"selected":""}>${esc(x)}</option>`).join("")}</select></label>
   <label id="uplace" ${/High Court|Supreme/.test(u.court)?"hidden":""}>${ut("place")}<input data-u="place" value="${esc(u.place)}" placeholder="e.g. Principal District Court, Tiruvallur"></label>
   <label>${ut("what")}<select data-u="type"><option value="">— ${ut("what")} —</option>
     ${[["writ","Writ"],["crl","Criminal"],["civ","Civil"],["oth","Other"]].map(([g,n])=>`<optgroup label="${n}">${UTYPES.filter(x=>x[1]===g).map(x=>`<option ${x[0]===u.type?"selected":""}>${esc(x[0])}</option>`).join("")}</optgroup>`).join("")}</select></label>
   <div class="list" style="gap:8px"><label style="gap:2px">${ut("when")}</label><div class="chips">${UWHEN.map(([k,n])=>`<button type="button" class="chip ${k==="today"?"hot":""}" data-when="${k}" aria-pressed="${u.when===k}">${n}</button>`).join("")}</div></div>
   <label>${ut("parties")}<input data-u="parties" value="${esc(u.parties)}" placeholder="e.g. Tom v. Jerry"></label>
   <label>${ut("ref")}<input data-u="ref" value="${esc(u.ref)}"></label>
   <label>${ut("facts")}<textarea data-u="facts" rows="5" placeholder="${esc(ut("factsPh"))}">${esc(u.facts)}</textarea></label>
  </section>
  ${filesBlock()}
  <section class="card"><h3>${t("yourContact")}</h3>
   <label>${t("name")}<input data-c="name" value="${esc(c.name)}" autocomplete="name"></label>
   <label>${t("mobile")}<input data-c="phone" type="tel" value="${esc(c.phone)}" autocomplete="tel" placeholder="${t("digits")}"></label>
   <label id="uenr" ${u.who==="adv"?"":"hidden"}>${ut("enr")}<input data-u="enr" value="${esc(u.enr)}" placeholder="Ms. ____/20__"></label>
   <label>${ut("city")}<input data-u="city" value="${esc(u.city)}"></label>
  </section>
  <section class="card uready"><h3>${ut("docs")}</h3><p class="note">${ut("docsList")}</p></section>
  <div id="fm"></div>
  <button class="btn urgbtn" id="usend">${ut("send")}</button>
  <button class="btn wa" id="uwa">${ut("wa")}</button>`;
  bindBack(); bindContact(app); bindFiles(()=>{const y=scrollY;render();scrollTo(0,y)});
  app.querySelectorAll("[data-u]").forEach(el=>{el.oninput=el.onchange=()=>{u[el.dataset.u]=el.value;urgSave();
    if(el.dataset.u==="court") $("#uplace").hidden=/High Court|Supreme/.test(el.value);};});
  app.querySelectorAll("[data-who]").forEach(b=>b.onclick=()=>{u.who=b.dataset.who;urgSave();app.querySelectorAll("[data-who]").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#uenr").hidden=u.who!=="adv";});
  app.querySelectorAll("[data-when]").forEach(b=>b.onclick=()=>{u.when=b.dataset.when;urgSave();app.querySelectorAll("[data-when]").forEach(x=>x.setAttribute("aria-pressed",x===b));});
  const ok=()=>{ if(!u.type||!u.facts.trim()||!c.name||!phoneOK(c.phone)){$("#fm").innerHTML=`<div class="msg err">${ut("need")}</div>`;$("#fm").scrollIntoView({block:"center"});return false;} return true; };
  $("#uwa").onclick=async()=>{ if(!ok())return; track("urgent_whatsapp",u.type);
    if(S.files.length&&navigator.canShare){try{const files=S.files.map(b64File); if(navigator.canShare({files})){await navigator.share({files,text:urgText()});return;}}catch(e){if(e&&e.name==="AbortError")return;}}
    window.open(waLink(urgText()),"_blank"); };
  $("#usend").onclick=()=>{ if(!ok())return; const b=$("#usend");
    if(!hasBackend()||!S.user||S.user.token==="local"){ track("urgent_whatsapp",u.type); window.open(waLink(urgText()),"_blank"); S.lastRef=""; go("urgentsent"); return; }
    b.disabled=true; b.textContent=t("sending");
    api("enquiry",{token:S.user.token,area:"URGENT FILING",problem:"URGENT – "+u.type+" – "+u.court,details:urgText(),name:c.name,phone:clean10(c.phone),time:(UWHEN.find(w=>w[0]===u.when)||[0,""])[1],files:filesPayload()})
     .then(r=>{S.lastRef=r.id;S.files=[];u.facts="";u.ref="";u.parties="";urgSave();track("urgent_sent",r.id);go("urgentsent");})
     .catch(e=>{ if(e&&e.code==="auth"){logout();go("login");return;} $("#fm").innerHTML=`<div class="msg err">${esc(e.error||"Error")}</div>`; b.disabled=false; b.textContent=ut("send"); });
  };
};
V.urgentsent=()=>{
  app.innerHTML=`<div class="uhero ok"><div class="usiren" aria-hidden="true">✅</div><div><h2>${ut("done")}</h2>${S.lastRef?`<p>${t("refNo")} <b>${esc(S.lastRef)}</b></p>`:""}</div></div>
  <p class="lead">${S.lastRef?ut("doneLead"):ut("waLead")}</p>
  <a class="btn ucall" href="tel:+91${CONFIG.PHONE.replace(/\D/g,"")}">${IC.call} ${ut("callNow")} · ${CONFIG.PHONE}</a>
  <a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink(urgText()+(S.lastRef?"\nRef: "+S.lastRef:"")))}">${S.lastRef?t("alsoWa"):ut("wa")}</a>
  <button class="btn ghost" id="h">${t("home")}</button>`;
  $("#h").onclick=goHome;
};

const it_=k=>(IT[k]||{})[LANG||"en"]||(IT[k]||{}).en;
function installNow(){
  if(installEvt){ const e=installEvt; e.prompt(); e.userChoice.then(c=>{ if(c&&c.outcome==="accepted"){track("install","accepted"); installEvt=null; render();} }).catch(()=>{}); return; }
  installSheet(isIOS()?"ios":"android");
}
function installSheet(kind){
  const old=$("#isheet"); if(old) old.remove();
  const ios=kind==="ios";
  const shareIc='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#0a84ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5v10h14V11h-1"/></svg>';
  const d=document.createElement("div"); d.id="isheet"; d.className="isheet"+(ios?" ios":"");
  d.innerHTML=`<div class="isbox" role="dialog" aria-modal="true" aria-label="${it_(ios?"iosT":"andT")}">
    <div class="isicon">NJ</div><h3>${it_(ios?"iosT":"andT")}</h3>
    <ol class="issteps"><li><span class="isn">1</span><span>${ios?shareIc:"<b class='dots'>⋮</b>"} ${it_(ios?"ios1":"and1")}</span></li>
     <li><span class="isn">2</span><span>${ios?"<b class='plus'>＋</b>":"<b class='plus'>⊕</b>"} ${it_(ios?"ios2":"and2")}</span></li>

V.hear=()=>{

   <div class="upgrid" style="grid-template-columns:1fr 1fr">
    <label class="btn ghost filebtn">${IC.camera} ${t("camera")}<input data-scan type="file" accept="image/*" capture="environment" hidden></label>
    <label class="btn ghost filebtn">${IC.gallery} ${t("gallery")}<input data-scan type="file" accept="image/*" multiple hidden></label></div>
   <div id="scanout"></div></section>
  <section class="card"><h3>${t("hearPick")}</h3>
   ${STAGE_GROUPS.map(g=>`<div class="list" style="gap:8px"><b class="crumb" style="color:var(--maroon)">${esc(g)}</b>${STAGES.filter(s=>s.g===g).map(s=>`<button class="row" data-st="${s.id}"><span><b>${esc(s.n)}</b></span><span class="chev">›</span></button>`).join("")}</div>`).join("")}</section>
  <p class="note">${t("hearNote")}</p>`;

  app.querySelectorAll("[data-scan]").forEach(inp=>inp.onchange=async()=>{const fs=[...inp.files]; inp.value=""; if(!fs.length)return; const o=$("#scanout");

    try{ const R=await scanMany(fs,o), r=R.r; const best=R.top?STAGES.find(s=>s.id===R.top):null;
      const ranked=[...(best?[best]:[]),...r.ranked.filter(s=>!best||s.id!==best.id)].slice(0,3);
      track("hearing_scan",fs.length+" photo(s): "+(r.line||"")+" → "+(ranked[0]?ranked[0].n:"no match"));
      const rep=R.top&&R.counts[R.top]>=3?`<div class="alert"><b class="t">${t("repeatTitle")}</b><span>${t("repeatMsg",{n:R.counts[R.top]})}</span></div>`:"";
      o.innerHTML=`${r.line?`<p>${t("stageSeen")}: <b>${esc(r.line)}</b></p>`:""}${r.next?`<p>${t("nextDate")}: <b>${esc(r.next)}</b></p>`:""}${rep}
        ${ranked.length?`<p class="note">${t("tapStage")}</p><div class="list">${ranked.map(s=>`<button class="row" data-st2="${s.id}"><span><b>${esc(s.n)}</b><small>${esc(s.g)}</small></span><span class="chev">›</span></button>`).join("")}</div>`
          :`<div class="msg err">${t("noStage")}</div>`}
        ${fs.length<5?`<div class="tip">${t("morePhotos")}</div>`:""}
        <button class="btn ai" id="askai">${IC.spark} ${t("askAiPhotos")}</button>`;
      o.querySelectorAll("[data-st2]").forEach(b=>b.onclick=()=>{S.stage=b.dataset.st2;S.stageFrom=Object.assign({},r,{count:R.counts[b.dataset.st2]||0});go("stage")});
    }catch(e){ o.innerHTML=`<div class="msg err">${t("scanFail")}</div><button class="btn ai" id="askai">${IC.spark} ${t("askAiPhotos")}</button>`; }
    const ab=$("#askai"); if(ab) ab.onclick=()=>{S.chatFiles=S.hearFiles.filter(f=>f.type.startsWith("image/")); stack.length=0; S.view="ai"; render();
      $("#aiq").value=t("whatToday"); };

V.profile=()=>{
  const p=Object.assign({},(S.user&&S.user.profile)||{}); p.name=p.name||(S.user&&S.user.name)||"";
  app.innerHTML=`${backBtn()}<h2>${t("profile")}</h2><p class="lead">${t("mobile")}: ${esc(S.user?S.user.phone:"")}</p>
  <section class="card">${profileFields(p,false)}
  </section>
  <div id="pm"></div><button class="btn" id="psave">${t("save")}</button>
  <section class="card"><h3>${t("changePin")}</h3><p class="note">${t("changePinLead")}</p>
   ${pinField("c_old",t("curPin"))}${pinField("c_new",t("newPinL"))}${pinField("c_new2",t("pinAgain"))}
   <div id="cm" aria-live="polite"></div><button class="btn ghost" id="csave">${t("changePin")}</button></section>`;
  bindBack(); const read=bindProfile(p);
  $("#csave").onclick=async()=>{ const o=$("#c_old").value,n=$("#c_new").value,n2=$("#c_new2").value,cm=$("#cm");
    const err=x=>cm.innerHTML=`<div class="msg err">${esc(x)}</div>`, ok=x=>cm.innerHTML=`<div class="msg ok">${esc(x)}</div>`;
    if(!/^\d{4}$/.test(o)||!/^\d{4}$/.test(n))return err(t("pin4")); if(n!==n2)return err(t("pinMismatch")); if(o===n)return err(t("pinSame"));
    const ph=S.user.phone, oh=await pinHash(ph,o), nh=await pinHash(ph,n);
    if(!hasBackend()||S.user.token==="local"){ const a=ACC.get(ph); if(!a||a.pin!==oh)return err(t("curPinWrong")); a.pin=nh; ACC.put(ph,a);
      const k=store.get("known"); if(k&&k.phone===ph){k.pin=nh;store.set("known",k);} ["c_old","c_new","c_new2"].forEach(i=>$("#"+i).value=""); return ok(t("pinChanged")); }
    $("#csave").disabled=true;
    api("changePin",{token:S.user.token,oldPin:o,pin:n}).then(()=>{const k=store.get("known"); if(k&&k.phone===ph){k.pin=nh;store.set("known",k);} ["c_old","c_new","c_new2"].forEach(i=>$("#"+i).value=""); ok(t("pinChanged")); $("#csave").disabled=false;})
     .catch(e=>{err(e.error||t("netErr")); $("#csave").disabled=false;}); };
  $("#psave").onclick=()=>{ read(); const pin="";
    if(!p.type){$("#pm").innerHTML=`<div class="msg err">${t("pickType")}</div>`;return;}
    S.user.profile=p; S.user.name=p.name||S.user.name; store.set("user",S.user); track("profile",p.type); { const a_=ACC.get(S.user.phone); if(a_){a_.profile=p;a_.name=S.user.name;ACC.put(S.user.phone,a_);} }
    const done=()=>{stack.length=0;S.view=p.type==="Advocate"?"diary":"home";render();};
    if(hasBackend()&&S.user.token!=="local") api("profile",{token:S.user.token,profile:p,pin:pin||undefined}).then(done).catch(e=>{$("#pm").innerHTML=`<div class="msg err">${esc(e.error||"Error")}</div>`;}); else done(); };
};

   ["share",IC.share,t("shareApp")],["lang",IC.nri,t("lang")],["help",IC.sos,t("helplines")],["adm",IC.govt,t("advLogin")]];
  const ty=userType(); const hide=ty==="Citizen"?["diary","hccal","hear"]:ty==="Law student"?["diary","hccal"]:[];
  return `<div class="list">${items.filter(([k])=>!hide.includes(k)).map(([k,ic,n])=>`<button class="row menu" data-m="${k}"><span class="mi">${ic}</span><b>${esc(n)}</b><span class="chev">›</span></button>`).join("")}</div>`;
}
function bindMenu(){
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const k=b.dataset.m;
    if(k==="about"||k==="privacy"||k==="terms"){S.page=k;go("page",{force:true});}
    else if(k==="disc"){S.page="disclaimer";go("page",{force:true});}
    else if(k==="adm") go("adminlogin"); else go(k);});
}
V.account=()=>{
  if(!S.user){ app.innerHTML=`<h2>${t("me")}</h2>${meMenu()}`; bindMenu(); return; }

    bindMenu(); $("#out").onclick=()=>{logout();goHome()}; return;}

      <span class="meta">${esc(e.time)} · Ref ${esc(e.id)} · ${e.files||0} ${t("docsCount")}</span>${e.note?`<div class="txt">${t("note")}: ${esc(e.note)}</div>`:""}
      <label class="btn small ghost filebtn">${IC.clip} ${t("addDocs")}<input type="file" accept="${ACCEPT_DOC}" multiple hidden data-more></label><span class="note" data-ok></span></div>`).join(""):`<p class="note">${t("noEnq")}</p>`;
    app.querySelectorAll("[data-more]").forEach(inp=>inp.onchange=async()=>{const c=inp.closest("[data-id]"),ok=c.querySelector("[data-ok]");const fs=[];
      for(const f of [...inp.files].slice(0,MAXF)){try{fs.push(await readFile(f))}catch(e){}} if(!fs.length)return; ok.textContent=t("sending");
      api("addFiles",{token:S.user.token,id:c.dataset.id,files:fs.map(f=>({name:f.name,type:f.type,data:f.data}))}).then(()=>ok.textContent=t("added")).catch(e=>ok.textContent=e.error||"Error");});})
   .catch(e=>{if(e&&e.code==="auth"){logout();go("login");return;} $("#mine").innerHTML=`<div class="msg err">${esc(e.error||"Error")}</div>`;});
};

/* ---------- Activity record (shown only in the Advocate dashboard) ---------- */
const TQ=[]; let tTimer=null;
function track(type,detail){
  if(!hasBackend()||!S.user) return;
  TQ.push({type,detail:String(detail||"").slice(0,200),at:Date.now()});
  clearTimeout(tTimer); tTimer=setTimeout(flushTrack,4000);
}
function flushTrack(){ if(!TQ.length||!S.user) return; const ev=TQ.splice(0,40); api("track",{token:S.user.token,events:ev}).catch(()=>{}); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushTrack(); });
document.addEventListener("click",e=>{const a=e.target.closest("[data-trk]"); if(a) track(a.dataset.trk,a.getAttribute("href")||"");},true);

/* ---------- Start ---------- */
function start(){
  splash();
  if(!LANG){S.view="lang";render();return;}
  if(!store.get("agreed")){S.view="disclaimer";render();return;}
  S.view=gate("home"); render(); remindNow();
  if(hasBackend()) api("settings").then(r=>{applySettings(r.settings); if(["home","login","unlock"].includes(S.view)) render();}).catch(()=>{});
  if(S.user&&S.unlocked&&hasBackend()&&S.user.token!=="local") api("ping",{token:S.user.token,lang:LANG}).then(r=>{ if(r.profile){S.user.profile=r.profile;store.set("user",S.user);} if(!S.user.profile||!S.user.profile.type){S.view="profile";render();} typeTabs(); tabs();
     syncCases().then(()=>{remindNow(); if(["home","diary"].includes(S.view)) render();}); }).catch(e=>{if(e&&e.code==="auth"){logout();goHome();}});
}
start();
