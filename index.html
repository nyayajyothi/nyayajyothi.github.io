<style>
:root{
  --bg:#fff8ec; --paper:#ffffff; --sandal:#f6e7c8; --line:#e6cf9f;
  --ink:#2b1a10; --muted:#6b4f3a; --maroon:#7d1d1d; --saffron:#b8430a; --saffron2:#e0780f;
  --gold:#c99a2e; --gold-soft:#fbefd2; --green:#1e6b3a; --leaf:#e5f2e6; --kumkum:#b3261e; --warn-bg:#fff1e0;
  --display:"Marcellus", Georgia, serif; --body:"Mukta", "Noto Sans", system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:20px;line-height:1.55;
  background-image:radial-gradient(circle at 1px 1px, rgba(201,154,46,.16) 1px, transparent 1.6px);background-size:22px 22px;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--saffron)}
.top{background:linear-gradient(180deg,#9c2a12 0%,var(--saffron) 55%,var(--saffron2) 100%);color:#fff7e6;position:relative;overflow:hidden;
  padding:14px max(16px,env(safe-area-inset-left,0px)) 0}
.gopuram{position:absolute;right:-6px;bottom:10px;width:150px;opacity:.28;color:#ffe7a8;pointer-events:none}
.brandrow{display:flex;align-items:center;gap:14px;max-width:640px;margin:0 auto;padding-bottom:14px;position:relative}
.mark{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:26px;
  color:var(--maroon);background:radial-gradient(circle,#fff6d8 0 55%,#f3c75a 56% 100%);box-shadow:0 0 0 3px #f6d27a, 0 0 18px rgba(255,214,120,.7)}
.name{font-family:var(--display);font-size:30px;line-height:1.1;letter-spacing:.02em}
.tag{font-size:16px;opacity:.95}
.kolam{height:14px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  background:radial-gradient(circle at 7px 7px,#fff3cf 2.4px,transparent 3px) 0 0/14px 14px, #7d1d1d}
main{max-width:640px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 24px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);color:var(--maroon);margin:0;line-height:1.2;font-weight:400;text-wrap:balance}
h1{font-size:32px} h2{font-size:28px} h3{font-size:23px}
p{margin:0}
.lead{color:var(--muted);font-size:20px}
.crumb{font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--saffron);font-weight:700}
.calm{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center}
.diya{width:54px;flex:none;color:var(--saffron2)}
.searchbtn{display:flex;align-items:center;gap:12px;width:100%;background:var(--paper);border:2px solid var(--gold);border-radius:16px;
  padding:16px 18px;font-size:21px;color:var(--muted);text-align:left;min-height:64px}
.searchbtn svg,.field-search svg{width:28px;height:28px;color:var(--saffron);flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:8px;
  min-height:150px;box-shadow:0 2px 0 var(--sandal)}
.tile:active{transform:translateY(1px)}
.tile:focus-visible,.row:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tile .ic{width:48px;height:48px;border-radius:14px;background:var(--gold-soft);display:grid;place-items:center;color:var(--saffron)}
.tile .ic svg{width:30px;height:30px}
.tile b{font-size:21px;line-height:1.25;color:var(--maroon)}
.tile span.d{font-size:16px;color:var(--muted);line-height:1.35}
.list{display:flex;flex-direction:column;gap:12px}
.row{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;text-align:left;display:flex;align-items:center;gap:14px;width:100%;min-height:72px}
.row b{display:block;font-size:21px;color:var(--maroon);line-height:1.3}
.row small{display:block;font-size:17px;color:var(--muted)}
.row .chev{margin-left:auto;font-size:30px;color:var(--gold);flex:none}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card.sol{border-color:var(--gold);background:linear-gradient(180deg,#fffaf0,#fff)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px}
ol.steps li{counter-increment:s;display:flex;gap:14px;font-size:20px}
ol.steps li::before{content:counter(s);flex:none;width:38px;height:38px;border-radius:50%;background:var(--saffron);color:#fff;display:grid;place-items:center;font-weight:700;font-size:19px;margin-top:2px}
.law{display:flex;flex-direction:column;gap:10px}
.lawrow{border-left:4px solid var(--gold);background:var(--gold-soft);border-radius:0 12px 12px 0;padding:10px 14px;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.lawrow b{color:var(--maroon);font-size:19px}
.lawrow span{display:block;font-size:18px}
.lawrow small{display:block;color:var(--muted);font-size:15px}
ul.docs{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px}
.alert{background:var(--warn-bg);border:1.5px solid #f0b46a;border-left:6px solid var(--kumkum);border-radius:14px;padding:16px;font-size:19px;display:flex;flex-direction:column;gap:10px}
.alert b.t{color:var(--kumkum)}
.result{font-weight:700;font-size:20px}
.result.late{color:var(--kumkum)} .result.ok{color:var(--green)}
.help{background:var(--leaf);border-radius:14px;padding:12px 16px;font-size:19px;color:var(--green);font-weight:600}

input,select,textarea{font:inherit;font-size:21px;color:var(--ink);background:#fffdf7;border:2px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;min-height:58px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
textarea{min-height:120px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--line);background:#fffdf7;border-radius:999px;padding:9px 18px;font-size:19px;min-height:50px}
.chip[aria-pressed="true"]{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border:0;border-radius:16px;padding:14px 18px;font-size:22px;font-weight:700;

.btn.wa{background:#1d7a45;box-shadow:0 3px 0 #0f4a29}
.btn.ghost{background:transparent;color:var(--maroon);border:2px solid var(--maroon);box-shadow:none}
.btn.small{min-height:50px;font-size:19px;width:auto;padding:8px 16px}
.btn[disabled]{opacity:.6}
.back{background:none;border:0;padding:4px 0;color:var(--saffron);font-weight:700;font-size:20px;align-self:flex-start}
.banner{background:linear-gradient(135deg,var(--maroon),#a3361a);color:#fff7e6;border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center;border:0;text-align:left;width:100%}
.banner b{font-size:22px;display:block;font-family:var(--display);font-weight:400}
.banner span{font-size:17px;opacity:.95}
.banner svg{width:44px;height:44px;flex:none;color:#ffd77a}
.sos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sos a{display:flex;flex-direction:column;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;text-decoration:none;color:var(--ink)}
.sos a b{font-size:24px;color:var(--kumkum)} .sos a span{font-size:16px;color:var(--muted)}
.field-search{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--gold);border-radius:16px;padding:4px 14px}
.field-search input{border:0;background:transparent;min-height:58px;padding:8px 0}
.field-search input:focus{outline:none}
.summary{white-space:pre-wrap;background:#fffdf7;border:1.5px dashed var(--gold);border-radius:14px;padding:14px;font-size:18px;overflow-wrap:anywhere}
.note{font-size:16px;color:var(--muted)}
.msg{border-radius:14px;padding:12px 16px;font-size:19px}
.msg.ok{background:var(--leaf);color:var(--green)} .msg.err{background:#fde8e6;color:var(--kumkum)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fffaf0;border-top:2px solid var(--gold);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(4px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;font-weight:600;color:var(--muted);padding:6px 0;min-height:64px}
.tabs .ti svg{width:28px;height:28px}
.tabs button[aria-current="page"]{color:var(--saffron)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--sandal);border-radius:14px;padding:5px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:52px;font-weight:700;font-size:19px;color:var(--maroon)}
.seg button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:30px;color:var(--maroon);font-variant-numeric:tabular-nums}
.stat span{font-size:15px;color:var(--muted)}
.enq{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.enq .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.enq .who{font-weight:700;font-size:21px;color:var(--maroon)}
.enq .meta{font-size:16px;color:var(--muted)}
.badge{font-size:15px;font-weight:700;border-radius:999px;padding:3px 12px;background:var(--gold-soft);color:var(--maroon);white-space:nowrap}
.badge.New{background:#fde2d0;color:var(--kumkum)} .badge.Closed{background:var(--leaf);color:var(--green)}
.enq .txt{white-space:pre-wrap;font-size:17px;background:#fffdf7;border-radius:10px;padding:10px;overflow-wrap:anywhere}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.foot{font-size:15px;color:var(--muted);text-align:center;padding-top:6px}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:15px}
.hl{background:#ffe9a8;border-radius:3px}
@media (max-width:360px){.grid{grid-template-columns:1fr}.tile{min-height:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.btn svg{width:28px;height:28px;flex:none}
/* --- v2 additions --- */
body.xl{font-size:23px} body.xl .row b,body.xl .tile b{font-size:24px} body.xl ol.steps li{font-size:23px} body.xl .lead{font-size:22px}
.hdrbtns{margin-left:auto;display:flex;gap:8px}
.hdrbtns button{background:rgba(255,247,230,.18);border:1.5px solid rgba(255,231,168,.7);color:#fff7e6;border-radius:12px;min-width:52px;min-height:48px;padding:4px 10px;font-weight:700;font-size:17px}
.tabs .tl{display:block}
.h-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn.small svg{width:22px;height:22px}
.banner.gold{background:linear-gradient(135deg,#c98a12,#e0a526);color:#3b1d05}
.banner.gold svg{color:#3b1d05}
.tip{background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:14px;padding:14px 16px;font-size:18px}
.langrow b{font-size:26px}
.langrow[aria-pressed="true"]{border-color:var(--saffron);background:#fff3e3}
.row.tel{text-decoration:none;color:inherit}
.row.tel b{font-size:25px;color:var(--kumkum);font-variant-numeric:tabular-nums}
.row.tel .chev svg{width:30px;height:30px;color:var(--green)}
.otpin{font-size:30px;letter-spacing:.4em;text-align:center}
.filebtn{cursor:pointer}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.thumb{position:relative;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fffdf7;display:flex;flex-direction:column}
.thumb img{width:100%;height:84px;object-fit:cover}
.thumb .pdf{height:84px;display:grid;place-items:center;font-weight:700;color:var(--kumkum);background:#fde8e6}
.thumb small{font-size:12px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:20px;line-height:1}
.stat{grid-template-columns:repeat(3,1fr)}
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 20%,#fff6dc 0,#fde9c2 45%,#f3c97a 100%);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) 16px;transition:opacity .45s;overflow:auto}
#splash.out{opacity:0}
.sp-in{max-width:560px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;animation:spin .6s ease-out}
@keyframes spin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.sp-mark{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:28px;color:var(--maroon);background:radial-gradient(circle,#fff6d8 0 55%,#f3c75a 56% 100%);box-shadow:0 0 0 3px #e0a526,0 0 24px rgba(224,165,38,.8)}
.sp-name{font-family:var(--display);font-size:34px;color:var(--maroon);line-height:1.1}
.sp-sub{font-size:18px;color:var(--muted)}
.sp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin-top:6px}
.sp-grid figure{margin:0;display:flex;flex-direction:column;gap:3px}
.sp-grid img,.sp-ph{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:12px;border:2.5px solid #e0a526;background:#fff3cf;box-shadow:0 2px 8px rgba(125,29,29,.18)}
.sp-ph{display:grid;place-items:center;font-size:30px;color:var(--maroon)}
.sp-grid figcaption{font-size:12.5px;line-height:1.2;color:var(--maroon);font-weight:600}
.sp-all{font-family:var(--display);font-size:18px;color:var(--maroon);margin-top:6px}
@media (max-width:360px){.sp-grid{gap:5px}.sp-grid figcaption{font-size:11px}}

.name{white-space:nowrap}
@media (max-width:440px){.name{font-size:25px}.tag{font-size:14px;line-height:1.3}.mark{width:50px;height:50px;font-size:22px}.hdrbtns button{min-width:46px;font-size:15px;padding:4px 8px}}
.tabs button{font-size:14px}

.upgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.upgrid .btn{flex-direction:column;gap:4px;font-size:17px;min-height:84px;padding:8px 4px}
.upgrid .btn svg{width:30px;height:30px}
@media (max-width:360px){.upgrid .btn{font-size:15px}}

.banner.wa{background:linear-gradient(135deg,#1d7a45,#25a35a);color:#fff}
.banner.wa svg{color:#fff}
#sharebtn{font-size:22px}

@media (max-width:440px){.hdrbtns{gap:5px}.hdrbtns button{min-width:42px;padding:4px 6px}.name{font-size:23px}}

a.banner{text-decoration:none}
.linkbtn{background:none;border:0;color:var(--green);font-weight:700;font-size:18px;text-decoration:underline;padding:0;margin-top:-10px;align-self:flex-start}
.toast{color:var(--green);font-weight:700}

</style>

 loan:["கைமாற்றுக் கடன் திரும்பவில்லை","பணம் கொடுத்தேன், திருப்பித் தரவில்லை",["ஆதாரங்களைச் சேகரியுங்கள்: புரோநோட், வங்கிப் பரிமாற்றம், காசோலை, வாட்ஸ்அப் செய்திகள், சாட்சிகளின் பெயர்கள்.","15 நாட்களுக்குள் பணம் செலுத்தக் கோரி வழக்கறிஞர் நோட்டீஸ் அனுப்புங்கள்.","செலுத்தவில்லை என்றால் பணம் வசூல் வழக்கு தொடருங்கள். புரோநோட் இருந்தால் விரைவான சுருக்க வழக்கு சாத்தியம்.","அவர் கொடுத்த காசோலை திரும்பினால், காசோலை வழக்கும் தொடரலாம்."],["புரோநோட் / ஒப்பந்தம்","பரிமாற்றத்தைக் காட்டும் வங்கி அறிக்கை","கடனை ஒப்புக்கொள்ளும் செய்திகள்"],"வசூல் வழக்கு பொதுவாக 3 ஆண்டுகளுக்குள் தொடர வேண்டும். எழுத்துமூல ஒப்புதல் அல்லது பகுதித் தொகை செலுத்தினால் புதிய காலம் கிடைக்கும்.","பணம் எப்போது திருப்பித் தர வேண்டியிருந்தது (அல்லது கொடுத்தது)?"],
 cheque:["காசோலை திரும்புதல்","காசோலை பணமின்றித் திரும்பியது",["வங்கியின் திருப்பு மெமோவைப் பெறுங்கள். அசல் காசோலையைப் பத்திரமாக வையுங்கள்.","திருப்பு மெமோ தேதியிலிருந்து 30 நாட்களுக்குள் பதிவுத் தபாலில் கோரிக்கை நோட்டீஸ் அனுப்புங்கள்.","நோட்டீஸ் கிடைத்தபின் 15 நாட்கள் காத்திருங்கள்.","செலுத்தவில்லை என்றால், அடுத்த 1 மாதத்திற்குள் நீதித்துறை நடுவரிடம் புகார் தாக்கல் செய்யுங்கள்."],["அசல் காசோலை","வங்கி திருப்பு மெமோ","நோட்டீஸ் நகலும் தபால் ரசீதும்"],"திருப்பு மெமோவிலிருந்து 30 நாட்களுக்குள் நோட்டீஸ் அனுப்ப வேண்டும். இந்தக் கால வரம்பு கண்டிப்பானது.","வங்கி திருப்பு மெமோவில் உள்ள தேதி"],

 path:["பாதை அடைக்கப்பட்டது","என் வீட்டுக்கான வழி மூடப்பட்டது",["FMB, கிராம வரைபடம் அல்லது பத்திரத்தில் பாதை உள்ளதா எனப் பாருங்கள்.","பொதுப் பாதை என்றால் ஊராட்சி / வட்டாட்சியரிடம் புகார் கொடுத்து அளவீடு கோருங்கள்.","20 ஆண்டுகளாகப் பயன்படுத்திய தனிப் பாதை அல்லது ஒரே வழி என்றால், தடை உத்தரவு வழக்கு தொடருங்கள்."],["பாதையைக் குறிப்பிடும் பத்திரம்","FMB / கிராம வரைபடம்","புகைப்படங்கள்"]],
 fakedoc:["என் நிலத்தில் போலி ஆவணம்","யாரோ என் நிலத்தைப் பதிவு செய்தனர்",["சார்பதிவாளர் அலுவலகத்தில் EC-யும் போலி ஆவணத்தின் சான்றிட்ட நகலும் பெறுங்கள்.","மாவட்டப் பதிவாளரிடமும் காவல்துறையிடமும் (நில அபகரிப்பு / போலி) புகார் கொடுங்கள்.","ஆவணத்தை ரத்து செய்ய சிவில் வழக்கு தொடருங்கள்."],["உங்கள் பத்திரம்","வில்லங்கச் சான்று","போலி ஆவண நகல்"],"ஆவணத்தை ரத்து செய்யும் வழக்கு, தெரிந்த நாளிலிருந்து பொதுவாக 3 ஆண்டுகளுக்குள் தொடர வேண்டும்.","போலி ஆவணம் பற்றி எப்போது தெரிந்தது?"],

 regdoc:["ஆவணம் பதிவு செய்தல்","கிரையம், தானம், செட்டில்மெண்ட், குத்தகை",["கிரையம், தானம், செட்டில்மெண்ட், 1 ஆண்டுக்கு மேலான குத்தகை கட்டாயம் பதிவு செய்ய வேண்டும்.","கையெழுத்திட்ட 4 மாதத்திற்குள் ஆவணத்தைப் பதிவுக்குச் சமர்ப்பியுங்கள்.","TNREGINET இணையதளத்தில் நேரம் முன்பதிவு செய்து முத்திரைத் தீர்வையும் கட்டணமும் செலுத்துங்கள்."],["வரைவு ஆவணம்","அடையாளச் சான்றுகள்","மூலப் பத்திரங்கள்","பட்டா"]],
 build:["பக்கத்தவரின் சட்டவிரோதக் கட்டடம்","அனுமதியின்றிக் கட்டுதல்",["கட்டடத்திற்கு திட்ட அனுமதி உள்ளதா என அறியுங்கள் (உள்ளாட்சியிடம் கேளுங்கள் அல்லது RTI).","மாநகராட்சி / நகராட்சி / ஊராட்சியில் எழுத்துமூலப் புகார் கொடுங்கள்.","நடவடிக்கை இல்லையெனில் உயர் நீதிமன்றத்தில் ரிட் தாக்கல் செய்யுங்கள்; உங்கள் நிலம் என்றால் தடை உத்தரவு வழக்கு."],["புகைப்படங்கள்","புகார் நகல்"]],
 nuisance:["பக்கத்தவர் தொல்லை","கழிவுநீர், சத்தம், புகை, குப்பை",["தேதிகளைக் குறித்து புகைப்படம் அல்லது வீடியோ எடுங்கள்.","ஊராட்சி / நகராட்சி / மாநகராட்சி மற்றும் காவல்துறையில் எழுத்துமூலப் புகார் கொடுங்கள்.","தொல்லையை அகற்ற வருவாய் கோட்டாட்சியரிடம் (RDO) விண்ணப்பியுங்கள்.","உங்கள் சொத்து பாதிக்கப்பட்டால் தடை உத்தரவு சிவில் வழக்கும் தொடரலாம்."],["புகைப்படங்கள் / வீடியோ","புகார் நகல்கள்"]],

 evict:["குடியிருப்பவர் வாடகை தரவில்லை / காலி செய்யவில்லை","வீட்டு உரிமையாளர்களுக்கு",["வாடகை ஒப்பந்தம் எழுத்துமூலம் உள்ளதா, வாடகை அதிகாரிக்குத் தெரிவிக்கப்பட்டதா எனப் பாருங்கள்.","நிலுவைக்கும் காலி செய்யவும் எழுத்துமூல நோட்டீஸ் அனுப்புங்கள்.","வாடகை நீதிமன்றத்தில் மனு தாக்கல் செய்யுங்கள். நீங்களே பூட்டவோ வெளியேற்றவோ கூடாது."],["வாடகை ஒப்பந்தம்","வாடகை ரசீதுகள்","நோட்டீஸ் நகல்"]],

 bail:["ஜாமீன் / முன்ஜாமீன்","கைது அல்லது கைது அச்சம்",["குற்ற எண்ணும் காவல் நிலைய விவரமும் பெறுங்கள்.","கைதுக்கு முன்: அமர்வு நீதிமன்றம் அல்லது உயர் நீதிமன்றத்தில் முன்ஜாமீன்.","கைதுக்குப் பின்: நீதித்துறை நடுவரிடம் ஜாமீன், பின்னர் அமர்வு நீதிமன்றம் அல்லது உயர் நீதிமன்றம்."],["FIR நகல்","காவல் நீட்டிப்பு உத்தரவு (கைதானால்)"]],

 theft:["திருட்டு","பொருட்கள் திருடப்பட்டன",["உடனே காவல்துறையில் புகார் கொடுங்கள்; பில்களுடன் திருடுபோன பொருட்களின் பட்டியல் கொடுங்கள்.","கைபேசி தொலைந்தால் CEIR (சஞ்சார் சாத்தி) இணையதளத்தில் முடக்குங்கள்.","காப்பீட்டுக்காக FIR நகல் கேளுங்கள்."],["பொருட்களின் பில் / புகைப்படம்"]],
 defame:["அவதூறு","பொய்யான பேச்சு என் பெயரைக் கெடுக்கிறது",["ஆதாரங்களைச் சேமியுங்கள் (ஸ்கிரீன்ஷாட், பதிவுகள், சாட்சிகள்).","மன்னிப்பும் திரும்பப்பெறுதலும் கோரி வழக்கறிஞர் நோட்டீஸ் அனுப்புங்கள்.","குற்றவியல் புகார் மற்றும் / அல்லது இழப்பீட்டு சிவில் வழக்கு தொடருங்கள்."],["ஸ்கிரீன்ஷாட்கள்","பதிவுகள்"]],
 summons:["சம்மன் / நீதிமன்ற நோட்டீஸ் வந்தது","என்ன செய்ய வேண்டும்?",["தேதி, நீதிமன்றப் பெயர், வழக்கு எண்ணைப் படியுங்கள்.","அலட்சியம் செய்ய வேண்டாம் – ஆஜராகாவிட்டால் பிடியாணை வரலாம்.","அதன் புகைப்படத்தை எங்களுக்கு அனுப்புங்கள்; ஆலோசனை தந்து உங்களுக்காக ஆஜராவோம்."],["சம்மன் நகல்"]],
 changeadv:["என் வழக்கறிஞரை மாற்ற வேண்டும்","வழக்கறிஞர் நீதிமன்றத்திற்கு வருவதில்லை",["வழக்கின் எந்த நிலையிலும் வழக்கறிஞரை மாற்ற உங்களுக்கு முழு உரிமை உண்டு.","தற்போதைய வழக்கறிஞரிடம் புதிய வக்காலத்தில் 'ஆட்சேபனை இல்லை' எனக் கையெழுத்தும், உங்கள் வழக்கு ஆவணங்களைத் திருப்பித் தரவும் எழுத்துமூலம் கேளுங்கள்.","அவர் தரவில்லை என்றால், பழைய வழக்கறிஞருக்கு நோட்டீஸுடன் புதிய வழக்கறிஞர் வக்காலத்தை மெமோவுடன் தாக்கல் செய்வார். நீதிமன்றம் மாற்றத்தை அனுமதிக்கும்.","கட்டணத்திற்காக உங்கள் வழக்கு ஆவணங்களை வழக்கறிஞர் வைத்துக்கொள்ள முடியாது (உச்ச நீதிமன்றம், R.D. சக்சேனா எதிர் பல்ராம் பிரசாத் சர்மா, 2000).","பணம் வாங்கி ஆஜராகவில்லை என்றால், தமிழ்நாடு மற்றும் புதுச்சேரி பார் கவுன்சிலில் புகார் செய்யலாம்."],["வழக்கு எண், நீதிமன்றப் பெயர்","பழைய வக்காலத் நகல்","கட்டண ரசீதுகள்","அடுத்த விசாரணை தேதி"]],
 status:["என் வழக்கின் நிலை / அடுத்த தேதி","என் வழக்கில் என்ன நடந்தது?",["எந்த நீதிமன்ற ஆவணத்திலும் CNR எண் அல்லது வழக்கு எண்ணைக் காணுங்கள்.","eCourts Services செயலி அல்லது இணையதளத்தில் (services.ecourts.gov.in) பாருங்கள்.","சென்னை உயர் நீதிமன்ற வழக்குகளுக்கு mhc.tn.gov.in இணையதளத்தில் பாருங்கள்.","வழக்கு எண்ணை அனுப்புங்கள், நாங்கள் பார்த்துச் சொல்வோம்."],["வழக்கு எண் உள்ள எந்த நீதிமன்ற ஆவணமும்"]],
 dismissed:["நான் ஆஜராகாததால் வழக்கு தள்ளுபடி","ஆஜராகாமைக்காகத் தள்ளுபடி",["உத்தரவு நகலையும் தள்ளுபடி தேதியையும் பெறுங்கள்.","ஏன் வர முடியவில்லை என்று விளக்கி, 30 நாட்களுக்குள் வழக்கை மீட்டெடுக்க மனு தாக்கல் செய்யுங்கள்.","30 நாட்கள் கடந்திருந்தால், தாமதத்தை மன்னிக்கக் கோரும் மனுவும் தாக்கல் செய்யுங்கள்."],["உத்தரவு நகல்","வர முடியாத காரணத்திற்கான ஆதாரம்"],"மீட்டெடுப்பு மனு உத்தரவுத் தேதியிலிருந்து 30 நாட்களுக்குள் தாக்கல் செய்ய வேண்டும்.","தள்ளுபடி உத்தரவுத் தேதி"],
 exparte:["என்னைக் கேட்காமல் உத்தரவு","ஒருதலைப்பட்ச தீர்ப்பாணை",["தீர்ப்பாணையின் சான்றிட்ட நகலைப் பெறுங்கள்.","தெரிந்த நாளிலிருந்து 30 நாட்களுக்குள் ஒருதலைப்பட்ச தீர்ப்பாணையை ரத்து செய்யக் கோரி மனு தாக்கல் செய்யுங்கள்.","சம்மன் வரவில்லை அல்லது வர முடியாத நியாயமான காரணம் இருந்தது என்று காட்டுங்கள்."],["தீர்ப்பாணை நகல்","ஆதாரம்"],"பொதுவாக 30 நாட்கள். உடனே செயல்படுங்கள்.","உத்தரவு பற்றி தெரிந்த தேதி"],
 appeal:["வழக்கில் தோற்றேன் – மேல்முறையீடு","மேல்முறையீட்டுக் கால வரம்பு",["தீர்ப்பு மற்றும் தீர்ப்பாணையின் சான்றிட்ட நகலுக்கு உடனே விண்ணப்பியுங்கள்.","மாவட்ட நீதிமன்றத்திற்கு மேல்முறையீடு பொதுவாக 30 நாட்களுக்குள், உயர் நீதிமன்றத்திற்கு 90 நாட்களுக்குள்.","சான்றிட்ட நகல் பெற ஆன காலம் கணக்கில் சேராது."],["தீர்ப்பு, தீர்ப்பாணை நகல்","வழக்கு ஆவணங்கள்"],"பெரும்பாலான நீதிமன்றங்களுக்கு 30 நாட்கள், உயர் நீதிமன்றத்திற்கு 90 நாட்கள்; சான்றிட்ட நகலுக்கான காலம் கூடுதல்.","தீர்ப்புத் தேதி"],
 certcopy:["சான்றிட்ட நகல் பெறுதல்","உத்தரவு அல்லது தீர்ப்பின் நகல்",["வழக்கு எண்ணுடன் நீதிமன்ற நகல் பிரிவில் விண்ணப்பியுங்கள்.","நகல் கட்டணம் செலுத்துங்கள்; அவசர நகலும் பெறலாம்.","பல உத்தரவுகளை eCourts-இல் பதிவிறக்கலாம்; ஆனால் மேல்முறையீட்டிற்கு சான்றிட்ட நகல் தேவை."],["வழக்கு எண்"]],
 delay:["பல ஆண்டுகளாக வழக்கு நிலுவை","விரைவான விசாரணை வேண்டும்",["மூத்த குடிமக்கள், பெண்கள், மாற்றுத்திறனாளிகள் முன்னுரிமை விசாரணை கோரலாம்.","தாமதத்தை விளக்கி முன்கூட்டிய விசாரணைக்கு மனு தாக்கல் செய்யுங்கள்.","இருதரப்பும் ஒப்புக்கொண்டால் சமரசம் அல்லது லோக் அதாலத் விரைவில் தீர்க்கும்."],["வழக்கு எண்","வயதுச் சான்று"]],
 lokadalat:["லோக் அதாலத்தில் வழக்கைத் தீர்க்க","விரைவான சமரசம்",["இருதரப்பும் சமரசத்திற்கு ஒப்புக்கொள்ள வேண்டும்.","வழக்கை அனுப்பக் கோரி நீதிமன்றம் அல்லது சட்டப் பணிகள் ஆணைக்குழுவிடம் விண்ணப்பியுங்கள்.","தீர்ப்பு இறுதியானது; செலுத்திய நீதிமன்றக் கட்டணம் விதிப்படி திருப்பித் தரப்படும்."],["வழக்கு ஆவணங்கள்"]],
 fraud:["ஆன்லைனில் பணம் இழந்தேன்","OTP / லிங்க் / அழைப்பு மோசடி",["உடனே 1930 அழையுங்கள் அல்லது cybercrime.gov.in-இல் புகார் செய்யுங்கள் – முதல் சில மணி நேரத்தில் பணத்தை முடக்குவது எளிது.","உங்கள் வங்கியை அழைத்து கார்டு / UPI-ஐ முடக்குங்கள்.","ஸ்கிரீன்ஷாட்கள், பரிவர்த்தனை எண்கள், அழைத்தவரின் எண்ணை வைத்திருங்கள்.","சைபர் குற்றப் பிரிவு காவல்துறையில் எழுத்துமூலப் புகார் கொடுங்கள்."],["பரிவர்த்தனை எண்கள்","ஸ்கிரீன்ஷாட்கள்","வங்கி அறிக்கை"],"ஆன்லைன் மோசடியை உடனே 1930-இல் தெரிவியுங்கள். ஒவ்வொரு மணி நேரமும் முக்கியம்.","மோசடி நடந்த தேதி"],
 upi:["UPI தவறான நபருக்குப் போனது","தவறான எண் அல்லது ID",["UPI செயலியில் அந்தப் பரிவர்த்தனையின் கீழ் புகார் செய்யுங்கள்.","பரிவர்த்தனை எண்ணுடன் உங்கள் வங்கிக்கு எழுதுங்கள்.","30 நாளில் தீரவில்லை என்றால் RBI குறைதீர்ப்பாளரிடம் (cms.rbi.org.in) புகார் செய்யுங்கள்."],["பரிவர்த்தனை ஸ்கிரீன்ஷாட்"]],
 fakeprofile:["போலி கணக்கு / மாற்றிய புகைப்படம்","என் புகைப்படங்கள் தவறாகப் பயன்படுத்தப்படுகின்றன",["மிரட்டலுக்குப் பணம் கொடுக்கவோ பதில் சொல்லவோ வேண்டாம்.","கணக்கின் லிங்குடன் ஸ்கிரீன்ஷாட் எடுத்து, தளத்தில் புகார் செய்யுங்கள்.","cybercrime.gov.in (பெண்கள், குழந்தைகள் பிரிவு) மற்றும் சைபர் குற்றப் பிரிவில் புகார் செய்யுங்கள்."],["ஸ்கிரீன்ஷாட்கள்","கணக்கு லிங்குகள்"]],
 loanapp:["கடன் செயலி தொந்தரவு","கடன் செயலியிலிருந்து மிரட்டல்",["மிரட்டலுக்குப் பயந்து தெரியாத கூடுதல் தொகை செலுத்த வேண்டாம்.","cybercrime.gov.in மற்றும் RBI சசெத் (sachet.rbi.org.in) இணையதளத்தில் புகார் செய்யுங்கள்.","மிரட்டல் செய்திகளுடன் காவல்துறையில் புகார் கொடுங்கள்."],["செயலியின் பெயர்","செய்திகள் / அழைப்புப் பதிவுகள்"]],
 hacked:["கணக்கு ஹேக் செய்யப்பட்டது","வாட்ஸ்அப், மின்னஞ்சல், சமூக ஊடகம்",["கடவுச்சொல்லை மாற்றி இரண்டு-படி சரிபார்ப்பை இயக்குங்கள்.","உங்கள் கணக்கிலிருந்து வரும் செய்திகளுக்குப் பணம் அனுப்ப வேண்டாம் என்று தொடர்புகளிடம் சொல்லுங்கள்.","தளத்திலும் cybercrime.gov.in-இலும் புகார் செய்யுங்கள்."],["ஸ்கிரீன்ஷாட்கள்"]],
 sarfaesi:["வங்கி வசூல் / சுவாதீன நோட்டீஸ்","SARFAESI நோட்டீஸ் வந்தது",["நோட்டீஸ் வகையைப் பாருங்கள்: 13(2) கோரிக்கை, 13(4) சுவாதீனம், அல்லது ஏல நோட்டீஸ்.","13(2) நோட்டீஸ் வந்த 60 நாட்களுக்குள் பணம் செலுத்துங்கள், சமரசம் செய்யுங்கள் அல்லது எழுத்துமூல ஆட்சேபனை அனுப்புங்கள் – வங்கி 15 நாட்களில் பதில் தர வேண்டும்.","சுவாதீனம் அல்லது ஏல நடவடிக்கைக்குப் பின், 45 நாட்களுக்குள் கடன் வசூல் தீர்ப்பாயத்தில் (DRT) மேல்முறையீடு செய்யலாம்."],["நோட்டீஸ்","கடன் கணக்கு அறிக்கை","கடன் அனுமதிக் கடிதம்"],"13(2) நோட்டீஸ் 60 நாட்கள் தருகிறது. முன்கூட்டியே செயல்படுங்கள்; அடுத்த நடவடிக்கைகள் வேகமாக நடக்கும்.","13(2) நோட்டீஸ் தேதி"],
 agents:["வசூல் முகவர்கள் தொந்தரவு","அழைப்புகள், வருகை, மிரட்டல்",["முகவர்கள் மிரட்டவோ திட்டவோ நேரம் தவறி அழைக்கவோ கூடாது (RBI விதிப்படி காலை 8 முதல் மாலை 7 வரை மட்டுமே அழைக்கலாம்).","வங்கிக்கு எழுத்துமூலப் புகார்; 30 நாளில் பதில் இல்லையெனில் RBI குறைதீர்ப்பாளரிடம் (cms.rbi.org.in) புகார்.","மிரட்டலுக்குக் காவல்துறையில் புகார் கொடுங்கள்."],["அழைப்புப் பதிவுகள்","செய்திகள்"]],
 debit:["எனக்குத் தெரியாமல் பணம் எடுக்கப்பட்டது","அனுமதியற்ற பரிவர்த்தனை",["3 வேலை நாட்களுக்குள் வங்கிக்குத் தெரிவியுங்கள் – RBI விதிப்படி உங்கள் இழப்பு பூஜ்யம்.","புகார் குறிப்பு எண் பெறுங்கள்.","பணம் திரும்பவில்லை என்றால் RBI குறைதீர்ப்பாளரிடம் புகார் செய்யுங்கள்."],["வங்கி அறிக்கை","புகார் குறிப்பு எண்"],"3 வேலை நாட்களுக்குள் தெரிவித்தால் RBI விதிப்படி உங்கள் இழப்பு பூஜ்யம்.","பணம் எடுக்கப்பட்ட தேதி"],
 gold:["நகைக் கடன் ஏல நோட்டீஸ்","அடகு நகை ஏலம் விடப்போகிறார்கள்",["ஏலத் தேதியையும் நிலுவைத் தொகையையும் பாருங்கள்.","எழுத்துமூலம் கால அவகாசம் கேளுங்கள், அல்லது பகுதித் தொகை செலுத்திப் புதுப்பியுங்கள்.","மதிப்பீடு மற்றும் ஏல விவரங்களைக் கேளுங்கள்; ஏலத்தில் மிச்சத் தொகை உங்களுக்குத் திருப்பித் தர வேண்டும்."],["அடகு ரசீது","ஏல நோட்டீஸ்"]],
 ots:["கடன் ஒருமுறை தீர்வு (OTS)","கடனை முடிக்க வேண்டும்",["ஒருமுறை தீர்வு வாய்ப்பு கோரி வங்கிக்கு எழுதுங்கள்.","பணம் செலுத்தும் முன் தீர்வு நிபந்தனைகளை எழுத்துமூலம் பெறுங்கள்.","செலுத்தியபின் நிலுவை இல்லாச் சான்றிதழையும் அசல் ஆவணங்களையும் பெறுங்கள்."],["கடன் அறிக்கை","நோட்டீஸ்கள்"]],
 docsback:["வங்கி ஆவணங்களைத் திருப்பவில்லை","கடன் முடிந்தும் பத்திரங்கள் தரவில்லை",["RBI விதிப்படி கடன் முடிந்த 30 நாட்களுக்குள் அசல் ஆவணங்களைத் திருப்பித் தர வேண்டும்.","தாமதத்திற்கு வங்கி நாளொன்றுக்கு ரூ. 5,000 இழப்பீடு தர வேண்டும்.","வங்கியிலும், பின்னர் RBI குறைதீர்ப்பாளரிடமும் புகார் செய்யுங்கள்."],["கடன் முடிவுக் கடிதம்","நிலுவை இல்லாச் சான்றிதழ்"]],
 cibil:["தவறான CIBIL / கடன் மதிப்பெண்","கடன் அறிக்கையில் தவறு",["கடன் அறிக்கையைப் பதிவிறக்கி தவறைக் குறியுங்கள்.","கடன் தகவல் நிறுவனத்திடமும் வங்கியிடமும் மறுப்பு எழுப்புங்கள்.","30 நாளில் திருத்தவில்லை என்றால் இழப்பீடும் RBI குறைதீர்ப்பாளர் புகாரும் சாத்தியம்."],["கடன் அறிக்கை","கடன் முடிவு ஆதாரம்"]],
 mutual:["பரஸ்பர ஒப்புதல் விவாகரத்து","இருவரும் பிரிய ஒப்புக்கொள்கிறோம்",["குறைந்தது 1 ஆண்டு தனித்தனியாக வாழ்ந்திருக்க வேண்டும்.","ஜீவனாம்சம், குழந்தைப் பராமரிப்பு, நகை திருப்புதல் பற்றி எழுத்துமூலம் ஒப்புக்கொள்ளுங்கள்.","குடும்ப நீதிமன்றத்தில் கூட்டு மனு தாக்கல் செய்யுங்கள். பொருத்தமான வழக்குகளில் 6 மாதக் காத்திருப்பு தளர்த்தப்படலாம்."],["திருமணச் சான்று / அழைப்பிதழ்","புகைப்படங்கள்","முகவரிச் சான்றுகள்"]],
 contested:["விவாகரத்து – துணை ஒப்புக்கொள்ளவில்லை","கொடுமை, கைவிடுதல் போன்றவை",["நிகழ்வுகளைத் தேதியுடன் குறியுங்கள்; செய்திகள், மருத்துவப் பதிவுகளை வைத்திருங்கள்.","தேவைப்பட்டால் நோட்டீஸ் அனுப்புங்கள், அல்லது சமரசம் முயலுங்கள்.","சரியான காரணத்தின் அடிப்படையில் குடும்ப நீதிமன்றத்தில் விவாகரத்து மனு தாக்கல் செய்யுங்கள்."],["திருமண ஆதாரம்","கொடுமை / கைவிடுதலுக்கான ஆதாரம்"]],
 maint:["ஜீவனாம்சம்","மனைவி, குழந்தைகள் அல்லது பெற்றோருக்கு",["மற்றவரின் வருமான ஆதாரம் சேகரியுங்கள் (சம்பளம், தொழில், சொத்து).","குடும்ப நீதிமன்றம் / நீதித்துறை நடுவரிடம் ஜீவனாம்ச மனு தாக்கல் செய்யுங்கள்.","வழக்கு நடக்கும்போதே இடைக்கால ஜீவனாம்சம் கோரலாம்."],["மற்றவரின் வருமான ஆதாரம்","உங்கள் செலவுப் பட்டியல்"]],
 dv:["குடும்ப வன்முறை","வீட்டில் கொடுமை",["ஆபத்தில் இருந்தால் 100 / 112 அல்லது பெண்கள் உதவி எண் 181 அழையுங்கள்.","பாதுகாப்பு அலுவலரைத் (மாவட்ட சமூக நல அலுவலகம்) தொடர்பு கொள்ளுங்கள்.","பாதுகாப்பு, குடியிருப்பு, பண நிவாரணம் கோரி நீதித்துறை நடுவரிடம் மனு தாக்கல் செய்யுங்கள்."],["மருத்துவப் பதிவுகள்","புகைப்படங்கள்","செய்திகள்"]],
 dowry:["வரதட்சணைக் கொடுமை","வரதட்சணைக் கோரிக்கை",["கோரிக்கைகளுக்கான ஆதாரம் வைத்திருங்கள் (செய்திகள், சாட்சிகள், கொடுத்த பொருட்களின் பட்டியல்).","அனைத்து மகளிர் காவல் நிலையத்தில் புகார் கொடுங்கள்.","உங்கள் நகைகளையும் பொருட்களையும் (சீதனம்) திருப்பித் தரக் கோருங்கள்."],["நகை / பொருட்கள் பட்டியல்","கோரிக்கைக்கான ஆதாரம்"]],
 custody:["குழந்தைப் பராமரிப்பு உரிமை","குழந்தைகள் யாரிடம்",["குழந்தையின் நலனைக் கொண்டே நீதிமன்றம் முடிவு செய்யும்.","குடும்ப நீதிமன்றத்தில் பராமரிப்பு மனு தாக்கல் செய்யுங்கள்.","மற்ற பெற்றோர் சந்திப்பு உரிமை கோரலாம்."],["பிறப்புச் சான்றிதழ்","பள்ளிப் பதிவுகள்"]],
 marreg:["திருமணப் பதிவு","என் திருமணத்தைப் பதிவு செய்ய",["திருமணம் நடந்த பகுதியின் சார்பதிவாளர் அலுவலகத்தில் விண்ணப்பியுங்கள் (TNREGINET-இல் இணையத்திலும்).","புகைப்படங்கள், அழைப்பிதழ், வயது மற்றும் முகவரிச் சான்று, சாட்சிகளுடன் வாருங்கள்.","தாமதப் பதிவு அபராதத்துடன் சாத்தியம்."],["அழைப்பிதழ்","புகைப்படங்கள்","வயதுச் சான்றுகள்"]],
 protect:["காதல் திருமணம் – குடும்ப மிரட்டல்","பாதுகாப்பு வேண்டும்",["வயது வந்த இருவரும் விருப்பப்படி திருமணம் செய்யலாம்.","திருமணத்தைப் பதிவு செய்து சான்றிதழை வைத்திருங்கள்.","SP-யிடம் புகார் கொடுத்து காவல் பாதுகாப்பு கோருங்கள்; உயர் நீதிமன்றமும் பாதுகாப்பு உத்தரவிடலாம்."],["வயதுச் சான்றுகள்","திருமணச் சான்றிதழ்"]],

 hitrun:["மோதிவிட்டு ஓடிய வாகனம்","வாகனம் தெரியவில்லை",["உடனே காவல்துறையில் புகார் கொடுங்கள்.","இழப்பீட்டுக்காக கோரிக்கை விசாரணை அலுவலரிடம் (RDO / வட்டாட்சியர்) விண்ணப்பியுங்கள்.","மருத்துவப் பதிவுகளையும் இறப்புச் சான்றிதழையும் (இருந்தால்) வைத்திருங்கள்."],["FIR","மருத்துவப் பதிவுகள்"]],

 civic:["சாலை, கால்வாய், தண்ணீர் பிரச்சனை","உள்ளாட்சி நடவடிக்கை இல்லை",["ஊராட்சி / மாநகராட்சியிலும் ஆட்சியரின் குறைதீர் நாளிலும் புகார் செய்யுங்கள்.","முதல்வர் உதவி எண் 1100 பயன்படுத்துங்கள்.","நடவடிக்கை இல்லையெனில் ரிட் தாக்கல் செய்யலாம்."],["புகைப்படங்கள்","புகார் நகல்கள்"]],

 neglect:["பிள்ளைகள் கவனிப்பதில்லை","பெற்றோருக்கு ஜீவனாம்சம்",["பராமரிப்புத் தீர்ப்பாயத்தில் (வருவாய் கோட்டாட்சியர்) விண்ணப்பியுங்கள்.","தீர்ப்பாயம் மாதம் ரூ. 10,000 வரை உத்தரவிடலாம்.","வழக்கறிஞர் தேவையில்லை; எழுத நாங்கள் உதவுவோம்."],["வயதுச் சான்று","பிள்ளைகளின் விவரங்கள்"]],

 elderabuse:["கொடுமை அல்லது மிரட்டல்","வீட்டில் பாதுகாப்பில்லை",["ஆபத்தில் இருந்தால் 14567 அல்லது 112 அழையுங்கள்.","காவல்துறையில் புகார் கொடுங்கள்.","குடியிருப்பு மற்றும் பாதுகாப்பு உத்தரவு கோருங்கள்."],["ஆதாரம்"]],
 harass:["தொந்தரவு / பின்தொடர்தல்","யாரோ பின்தொடர்கிறார்கள் அல்லது தொந்தரவு செய்கிறார்கள்",["ஆபத்தில் இருந்தால் 181, 1091 அல்லது 112 அழையுங்கள். தமிழ்நாடு காவல்துறையின் காவல் உதவி செயலியைப் பயன்படுத்துங்கள்.","செய்திகளையும் அழைப்புப் பதிவுகளையும் சேமியுங்கள்.","அனைத்து மகளிர் காவல் நிலையத்தில் புகார் கொடுங்கள்."],["ஸ்கிரீன்ஷாட்கள்","அழைப்புப் பதிவுகள்"]],

 affidavit:["உறுதிமொழிப் பத்திரம் / நோட்டரி","சத்தியப் பிரமாண அறிக்கை",["நோக்கத்தைச் சொல்லுங்கள்; சரியான முத்திரைத் தாளில் வரைந்து தருவோம்.","அடையாளச் சான்றுடன் நோட்டரி அல்லது உறுதிமொழி ஆணையர் முன் கையெழுத்திடுங்கள்."],["அடையாளச் சான்று"]],
 namechange:["பெயர் மாற்றம்","அரசிதழ் அறிவிப்பு",["பெயர் மாற்றத்திற்கு உறுதிமொழிப் பத்திரம் தயார் செய்யுங்கள்.","செய்தித்தாளில் வெளியிட்டு, தமிழ்நாடு அரசிதழுக்கு (எழுதுபொருள் மற்றும் அச்சுத் துறை) விண்ணப்பியுங்கள்.","ஆதார், PAN, சான்றிதழ்களைப் புதுப்பியுங்கள்."],["அடையாளச் சான்றுகள்","பழைய சான்றிதழ்கள்"]],
 lost:["அசல் ஆவணங்கள் தொலைந்தன","பத்திரம் அல்லது சான்றிதழ் தொலைந்தது",["காவல்துறையில் புகார் கொடுத்து CSR / ஆவணம் தொலைந்த சான்றிதழ் பெறுங்கள்.","செய்தித்தாளில் அறிவிப்பு வெளியிடுங்கள்.","சார்பதிவாளர் அலுவலகம் அல்லது வழங்கிய அலுவலகத்திலிருந்து சான்றிட்ட நகல் பெறுங்கள்."],["நகல் (இருந்தால்)","ஆவண எண்"]],
 gstnotice:["GST நோட்டீஸ் வந்தது","காரணம் கேட்கும் நோட்டீஸ் அல்லது கோரிக்கை",["நோட்டீஸில் உள்ள பதில் தேதியைக் குறியுங்கள் – தவறவிடாதீர்கள்.","உங்கள் ரிட்டர்ன்கள், பில்கள், துறையின் கணக்கீட்டைச் சேகரியுங்கள்.","GST இணையதளத்தில் பதில் தாக்கல் செய்து நேரில் விசாரணை கோருங்கள்.","உத்தரவுக்கு எதிராக 3 மாதத்திற்குள் மேல்முறையீடு செய்யலாம்."],["நோட்டீஸ்","GST ரிட்டர்ன்கள்","பில்கள்"],"GST உத்தரவுக்கு எதிரான மேல்முறையீடு 3 மாதத்திற்குள் தாக்கல் செய்ய வேண்டும்.","GST உத்தரவுத் தேதி (மேல்முறையீட்டுக்கு)"],
 itnotice:["வருமான வரி நோட்டீஸ்","வரித் துறையிடமிருந்து நோட்டீஸ்",["வருமான வரி இ-ஃபைலிங் இணையதளத்தில் நுழைந்து நோட்டீஸை முழுமையாகப் படியுங்கள்.","கடைசித் தேதிக்கு முன் ஆவணங்களுடன் பதில் கொடுங்கள்; தேவைப்பட்டால் கூடுதல் அவகாசம் கேளுங்கள்.","உத்தரவுக்கு எதிராக மேல்முறையீட்டு அதிகாரியிடம் மேல்முறையீடு செய்யலாம்."],["நோட்டீஸ்","ரிட்டர்ன்கள்","வங்கி அறிக்கைகள்"]],
 partnership:["கூட்டாண்மைத் தகராறு","கூட்டாளிகள் லாபம் பகிரவில்லை",["கூட்டாண்மைப் பத்திரத்தில் நடுவர் தீர்ப்பு விதி உள்ளதா பாருங்கள்.","கணக்குகளை எழுத்துமூலம் கேளுங்கள்.","நோட்டீஸ் அனுப்புங்கள்; பின்னர் நடுவர் தீர்ப்பு அல்லது கலைப்பு மற்றும் கணக்கு வழக்கு."],["கூட்டாண்மைப் பத்திரம்","கணக்குகள்","பதிவுச் சான்றிதழ்"]],
 brand:["என் பிராண்டை யாரோ நகலெடுக்கிறார்கள்","வணிகக் குறி தவறான பயன்பாடு",["உங்கள் பயன்பாட்டுக்கும் (பில்கள், விளம்பரங்கள்) அவர்களின் நகலுக்கும் ஆதாரம் சேகரியுங்கள்.","வணிகக் குறியைப் பதிவு செய்யவில்லை என்றால் பதிவு செய்யுங்கள்.","நிறுத்தக் கோரும் நோட்டீஸ் அனுப்புங்கள்; தேவைப்பட்டால் தடை உத்தரவு வழக்கு."],["வணிகக் குறிச் சான்றிதழ் / விண்ணப்பம்","நகல்களின் புகைப்படங்கள்"]],
 contract:["ஒப்பந்தம் எழுத அல்லது சரிபார்க்க","ஒப்பந்தம், MoU, குத்தகை",["தரப்பினர், தொகை, காலம், கடமைகளைச் சொல்லுங்கள்.","அபாயங்களுக்கும் விடுபட்ட விதிகளுக்கும் நாங்கள் எழுதி அல்லது சரிபார்த்துத் தருவோம்.","சாட்சிகளுடன் கையெழுத்திடுங்கள்; சொத்து தொடர்பானது என்றால் பதிவு செய்யுங்கள்."],["வரைவு (இருந்தால்)"]],
 company:["கம்பெனி / நிறுவனம் தொடங்க","கம்பெனி, LLP, கூட்டாண்மை",["வடிவத்தைத் தேர்ந்தெடுங்கள்: தனியுரிமை, கூட்டாண்மை, LLP அல்லது பிரைவேட் லிமிடெட்.","நிறுவனர்களின் PAN, ஆதார், முகவரிச் சான்று சேகரியுங்கள்.","பதிவு, GST, ஒப்பந்தங்களுக்கு நாங்கள் உதவுவோம்."],["PAN, ஆதார்","முகவரிச் சான்று"]],
 nripoa:["வெளிநாட்டிலிருந்து அதிகாரப் பத்திரம்","இந்தியாவில் எனக்காகச் செயல்பட ஒருவர்",["இந்தியத் தூதரகம் / துணைத் தூதரகம் முன், அல்லது அபோஸ்டில் உடன் நோட்டரி முன் கையெழுத்திடுங்கள்.","இந்தியாவுக்கு அனுப்புங்கள்; பெற்ற 3 மாதத்திற்குள் முத்திரைத் தீர்வை செலுத்துங்கள்.","சொத்துக்கு என்றால் சார்பதிவாளர் அலுவலகத்தில் பதிவு / மதிப்பீடு செய்யுங்கள்."],["பாஸ்போர்ட் நகல்","சொத்து விவரங்கள்"]],
 nriprotect:["இந்தியாவில் என் சொத்தைப் பாதுகாக்க","நான் வெளிநாட்டில் வாழும்போது",["பட்டாவும் மின் இணைப்பும் உங்கள் பெயரில் இருக்கட்டும்; ஒவ்வொரு ஆண்டும் வரி செலுத்துங்கள்.","நிலத்துக்கு வேலி, பெயர்ப் பலகை போட்டு, ஒவ்வொரு ஆண்டும் EC பாருங்கள்.","எழுத்துமூல ஒப்பந்தத்துடன் மட்டுமே வாடகைக்கு விடுங்கள்; ஆக்கிரமிப்பில் உடனே செயல்படுங்கள்."],["பத்திரங்கள்","பட்டா","வில்லங்கச் சான்று"]],
 nrisell:["NRI-யாக சொத்து விற்பனை","வரியும் வெளிநாட்டுக்குப் பணம் அனுப்புதலும்",["வாங்குபவர் NRI விகிதத்தில் வரி (TDS) பிடிப்பார்; குறைந்த பிடித்தச் சான்றிதழ் பெறலாம்.","பணத்தை உங்கள் NRO கணக்கில் பெறுங்கள்.","CA சான்றிதழுடன் ஆண்டுக்கு 10 லட்சம் அமெரிக்க டாலர் வரை வெளிநாட்டுக்கு அனுப்பலாம்."],["பத்திரங்கள்","PAN","பாஸ்போர்ட்"]],
 nriinherit:["இந்தியாவில் மரபுரிமைச் சொத்து","பெற்றோர் இறந்த பின்",["NRI-கள் இந்தியாவில் எந்தச் சொத்தையும் மரபுரிமையாகப் பெறலாம்.","வாரிசுச் சான்றிதழ் பெற்று பட்டா மாற்றுங்கள்.","அதிகாரப் பத்திரம் மூலம் உறவினர் இங்கு வேலைகளைச் செய்யலாம்."],["இறப்புச் சான்றிதழ்","குடும்ப விவரங்கள்"]]

const inGAS=()=>typeof google!=="undefined"&&google.script&&google.script.run;
const hasBackend=()=>!!(inGAS()||CONFIG.API);
function api(action,data){
  const body=Object.assign({action},data||{});
  if(inGAS()) return new Promise((res,rej)=>google.script.run.withSuccessHandler(r=>r&&r.ok===false?rej(r):res(r)).withFailureHandler(()=>rej({error:t("netErr")})).api(body));
  if(!CONFIG.API) return Promise.reject({error:"offline"});
  return fetch(CONFIG.API,{method:"POST",body:JSON.stringify(body)}).then(r=>r.json()).then(r=>r.ok===false?Promise.reject(r):r,e=>Promise.reject(e&&e.error?e:{error:t("netErr")}));
}

/* ---------- Shared bits ---------- */
function field(q){
  const v=S.ans[q.k]??(q.type==="m"?[]:"");
  if(q.type==="c"||q.type==="m") return `<div class="list" style="gap:8px"><label style="gap:2px">${esc(qL(q.l))}</label><div class="chips">${q.opts.map(o=>`<button type="button" class="chip" data-k="${q.k}" data-m="${q.type==="m"}" data-v="${esc(o)}" aria-pressed="${q.type==="m"?v.includes(o):v===o}">${esc(optL(o))}</button>`).join("")}</div></div>`;
  const ty={d:"date",n:"number",t:"text"}[q.type];
  return `<label>${esc(qL(q.l))}${q.hint?`<span class="hint">${esc(qL(q.hint))}</span>`:""}<input data-k="${q.k}" type="${ty}" ${ty==="number"?'inputmode="numeric" min="0"':""} value="${esc(v)}" placeholder="${esc(q.ph||"")}"></label>`;
}
function bindFields(root,onChange){
  root.querySelectorAll("input[data-k],textarea[data-k]").forEach(el=>el.oninput=()=>{S.ans[el.dataset.k]=el.value; onChange&&onChange(el.dataset.k);});
  root.querySelectorAll(".chip[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;
    if(b.dataset.m==="true"){const a=S.ans[k]||[];S.ans[k]=a.includes(v)?a.filter(x=>x!==v):(v==="None"?["None"]:[...a.filter(x=>x!=="None"),v]);
      b.parentElement.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",S.ans[k].includes(c.dataset.v)));}
    else{S.ans[k]=S.ans[k]===v?"":v; b.parentElement.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===S.ans[k]));}});
}
function limitResult(L){
  const from=S.ans[L.q]; if(!from) return "";
  const end=new Date(from+"T00:00:00");
  if(L.y) end.setFullYear(end.getFullYear()+L.y); else if(L.m) end.setMonth(end.getMonth()+L.m); else end.setDate(end.getDate()+L.d);
  const days=Math.round((end-new Date().setHours(0,0,0,0))/864e5), e=end.toLocaleDateString("en-GB").replace(/\//g,".");
  return days<0?`<div class="result late">${esc(t("limitOver",{d:e}))}</div>`:`<div class="result ${days<31?"late":"ok"}">${esc(t("daysLeft",{n:days,d:e}))}</div>`;
}
function summaryText(){ /* always English, for the Advocate */
  const c=S.contact, L=["New enquiry – Nyaya Jyothi"];
  if(c.name)L.push("Name: "+c.name); if(c.phone)L.push("Phone: "+c.phone); L.push("Best time to call: "+(c.time||"Any time"));
  if(S.item){L.push("","Matter: "+S.area.n+" – "+S.item.n);
    const qs=[...(S.item.a||[])]; if(S.item.lim) qs.unshift({k:S.item.lim.q,l:S.item.lim.ql,type:"d"});
    qs.forEach(q=>{let v=S.ans[q.k]; if(!v||(Array.isArray(v)&&!v.length))return;
      if(q.type==="d")v=fmtD(v); else if(q.type==="n"&&/Rs\./.test(q.l))v=fmtRs(v); else if(Array.isArray(v))v=v.join(", ");
      L.push(q.l.replace(/\?$/,"").replace(/\s*\(Rs\.\)/,"")+": "+v);});}
  if(S.ans.story)L.push("","Details: "+S.ans.story);
  if(S.files.length)L.push("","Documents attached: "+S.files.length);
  L.push("Language: "+({en:"English",ta:"Tamil",hi:"Hindi"}[LANG||"en"]));

}

/* ---------- Files: photos and PDFs ---------- */
const MAXF=8, MAXB=5*1024*1024;
function readFile(f){ return new Promise((res,rej)=>{
  if(f.type.startsWith("image/")){ const img=new Image(), url=URL.createObjectURL(f);
    img.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const d=c.toDataURL("image/jpeg",.78);
      res({name:f.name.replace(/\.\w+$/,"")+".jpg",type:"image/jpeg",data:d.split(",")[1],size:Math.round(d.length*.75),preview:d});};
    img.onerror=()=>rej(); img.src=url; }
  else { if(f.size>MAXB) return rej("big"); const r=new FileReader(); r.onload=()=>res({name:f.name,type:f.type||(/\.docx$/i.test(f.name)?"application/vnd.openxmlformats-officedocument.wordprocessingml.document":/\.doc$/i.test(f.name)?"application/msword":"application/pdf"),data:String(r.result).split(",")[1],size:f.size}); r.onerror=()=>rej(); r.readAsDataURL(f); }
});}
const ACCEPT_DOC="application/pdf,.pdf,.doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/*";
const extOf=f=>(f.name.split(".").pop()||"").toUpperCase().slice(0,4);
function filesBlock(){
  return `<section class="card"><h3>${t("uploads")}</h3><p class="note">${t("uploadHint")}</p>
  <div class="thumbs" id="thumbs">${S.files.map((f,i)=>`<div class="thumb">${f.preview?`<img src="${f.preview}" alt="">`:`<span class="pdf">${esc(extOf(f))}</span>`}<small>${esc(f.name)}</small><button data-rm="${i}" aria-label="${t("remove")}">×</button></div>`).join("")}</div>
  <div class="upgrid">
   <label class="btn ghost filebtn">${IC.camera} ${t("camera")}<input data-fin type="file" accept="image/*" capture="environment" hidden></label>
   <label class="btn ghost filebtn">${IC.gallery} ${t("gallery")}<input data-fin type="file" accept="image/*" multiple hidden></label>
   <label class="btn ghost filebtn">${IC.clip} ${t("docfile")}<input data-fin type="file" accept="${ACCEPT_DOC}" multiple hidden></label>
  </div><div id="fmsg"></div></section>`;
}
function bindFiles(rerender){
  app.querySelectorAll("[data-fin]").forEach(fin=>fin.onchange=async()=>{const m=$("#fmsg"); for(const f of fin.files){ if(S.files.length>=MAXF){m.innerHTML=`<div class="msg err">${t("maxFiles")}</div>`;break;}
      try{S.files.push(await readFile(f))}catch(e){m.innerHTML=`<div class="msg err">${t("tooBig")}</div>`}}
    fin.value=""; rerender();});
  app.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.files.splice(+b.dataset.rm,1);rerender();});
}
/* Send on WhatsApp: with files when the phone supports sharing, else open the chat */
function b64File(f){const bin=atob(f.data),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new File([u],f.name,{type:f.type});}
async function sendWhatsApp(){
  const txt=summaryText(), m=$("#fm");
  if(S.files.length&&navigator.canShare){ try{const files=S.files.map(b64File);
      if(navigator.canShare({files})){await navigator.share({files,text:txt+"\n\nTo: A. Neeraj, Advocate – +91 "+CONFIG.PHONE});return;}}catch(e){if(e&&e.name==="AbortError")return;} }
  window.open(waLink(txt),"_blank");
  if(S.files.length&&m) m.innerHTML=`<div class="msg ok">${t("attachNote")}</div>`;
}

/* ---------- Search ---------- */
function searchAll(q){
  const w=q.toLowerCase().split(/\s+/).filter(x=>x.length>1); if(!w.length) return [];
  const out=[];
  AREAS.forEach(a=>a.items.forEach(it=>{const x=tr()&&tr().P[it.id]||{};
    const hay=(it.n+" "+it.s+" "+(it.k||"")+" "+a.n+" "+(x.n||"")+" "+(x.s||"")+" "+aN(a)).toLowerCase(), body=((it.st||[]).join(" ")+" "+(x.st||[]).join(" ")).toLowerCase();
    let sc=0; w.forEach(z=>{if(hay.includes(z))sc+=3; else if(body.includes(z))sc+=1;}); if(sc) out.push({sc,type:"p",a,it});}));
  Object.entries(ACTS).forEach(([k,A])=>A.s.forEach(([s,m])=>{const hay=(A.n+" "+s+" "+m).toLowerCase(); let sc=0; w.forEach(z=>{if(hay.includes(z))sc+=2;}); if(sc>=2*Math.min(w.length,2)||(w.length===1&&sc)) out.push({sc:sc-0.5,type:"s",k,s,m,A});}));
  return out.sort((x,y)=>y.sc-x.sc).slice(0,40);
}

  <div class="list" id="al"></div>`;
  const draw=f=>{$("#al").innerHTML=Object.entries(ACTS).filter(([k,A])=>!f||(A.n+" "+A.o).toLowerCase().includes(f.toLowerCase())).map(([k,A])=>`<button class="row" data-k="${k}"><span><b>${esc(A.n)}</b><small>${esc(A.o)}</small></span><span class="chev">›</span></button>`).join("");
    app.querySelectorAll("#al [data-k]").forEach(b=>b.onclick=()=>{S.act=b.dataset.k;S.actSec=null;go("act")});};
  $("#fa").oninput=e=>draw(e.target.value); draw("");
};
V.act=()=>{
  const A=ACTS[S.act]; const used=[];AREAS.forEach(a=>a.items.forEach(it=>{if((it.l||[]).some(x=>x[0]===S.act))used.push({a,it})}));
  app.innerHTML=`${backBtn()}<div class="list" style="gap:4px"><span class="crumb">${t("acts")}</span><h2>${esc(A.n)}</h2><p class="lead">${esc(A.o)}</p></div>
  <section class="card"><h3>${t("keySecs")}</h3><div class="law">${A.s.map(([s,m])=>`<div class="lawrow" id="sec-${esc(s).replace(/\W/g,"")}" ${s===S.actSec?'style="background:#ffe9a8"':""}><b>${esc(s)}</b><span>${esc(m)}</span></div>`).join("")}</div>
  <a class="btn ghost" target="_blank" rel="noopener" href="${actLink(S.act)}">${t("fullAct")}</a></section>
  ${used.length?`<section class="card"><h3>${t("lawHelps")}</h3><div class="list">${used.map((u,i)=>`<button class="row" data-u="${i}"><span><b>${esc(pT(u.it,"n"))}</b><small>${esc(aN(u.a))}</small></span><span class="chev">›</span></button>`).join("")}</div></section>`:""}`;
  bindBack();
  app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const u=used[b.dataset.u];S.area=u.a;S.item=u.it;S.ans={};S.files=[];go("problem")});
  if(S.actSec){const el=document.getElementById("sec-"+S.actSec.replace(/\W/g,""));if(el)setTimeout(()=>el.scrollIntoView({block:"center"}),50);}
};

/* ---------- Sign in with mobile + WhatsApp OTP ---------- */
V.login=()=>{
  app.innerHTML=`<div class="calm"><div class="diya">${IC.diya}</div><div><h1>${t("welcome")}</h1><p class="lead">${t("loginLead")}</p></div></div>
  <section class="card">
   <label>${t("name")}<input id="u_name" autocomplete="name" value="${esc(S.contact.name||"")}"></label>
   <label>${t("mobileWa")}<input id="u_phone" type="tel" inputmode="tel" value="${esc(S.contact.phone||"")}" placeholder="${t("digits")}"></label>
   <label>${t("district")}<input id="u_dist" value="${esc(S.contact.district||"")}"></label>
   <button class="btn" id="go">${t("sendOtp")}</button>
   <p class="note">${t("privacy")}</p></section><div id="am"></div>
  <div class="grid"><button class="btn ghost" id="lg">${t("lang")}</button><button class="btn ghost" id="hl">${t("helplines")}</button></div>`;
  const m=$("#am"),err=x=>m.innerHTML=`<div class="msg err">${esc(x)}</div>`;
  $("#lg").onclick=()=>go("lang"); $("#hl").onclick=()=>go("help");
  $("#go").onclick=()=>{const name=$("#u_name").value.trim(),phone=clean10($("#u_phone").value),district=$("#u_dist").value.trim();
    if(!name)return err(t("nameReq")); if(!phoneOK(phone))return err(t("phoneReq"));
    Object.assign(S.contact,{name,phone,district});store.set("contact",S.contact);
    const g=$("#go"); g.disabled=true; g.textContent=t("sending");
    api("start",{name,phone,district,lang:LANG||"en"}).then(r=>{ if(r.needOtp){S.otpFor={phone,name,district};go("otp")} else loggedIn(r); })
     .catch(e=>{err(e.error||"Error");g.disabled=false;g.textContent=t("sendOtp");});};
};
V.otp=()=>{
  const o=S.otpFor;
  app.innerHTML=`<h2>${t("enterOtp")}</h2><p class="lead">${t("otpSent")} ${esc(o.phone.slice(-4))}.</p>
  <section class="card"><label>OTP<input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" class="otpin"></label>
  <button class="btn" id="go">${t("verify")}</button><button class="btn ghost" id="again">${t("resend")}</button><button class="btn ghost" id="chg">${t("changeNo")}</button></section><div id="om"></div>`;
  const m=$("#om"),err=x=>m.innerHTML=`<div class="msg err">${esc(x)}</div>`;
  $("#go").onclick=()=>{const code=$("#otp").value.trim(); if(!/^\d{6}$/.test(code))return err(t("otp6"));
    api("verify",{phone:o.phone,code}).then(loggedIn).catch(e=>err(e.error||"Wrong OTP"));};
  $("#again").onclick=()=>api("start",{name:o.name,phone:o.phone,district:o.district,lang:LANG||"en"}).then(()=>m.innerHTML=`<div class="msg ok">${t("sentAgain")}</div>`).catch(e=>err(e.error||"Error"));
  $("#chg").onclick=()=>{S.view="login";render()};
};
function loggedIn(r){
  S.user={token:r.token,name:r.name,phone:r.phone}; store.set("user",S.user);
  stack.length=0;
  if(S.after==="submit"&&S.item!==undefined){S.after=null; S.view=S.item?"form":"expert"; render(); setTimeout(submitEnquiry,50); return;}
  S.view="home"; render();
}
function logout(){ S.user=null; store.del("user"); }
V.account=()=>{
  if(!hasBackend()){app.innerHTML=`<h2>${t("me")}</h2><div class="card"><p>${t("offlineAcct")}</p><a class="btn wa" target="_blank" rel="noopener" href="${waLink("Vanakkam Sir, I need legal help.")}">${t("waAdv")}</a></div>
    <div class="grid"><button class="btn ghost" id="lg">${t("lang")}</button><button class="btn ghost" id="adm">${t("advLogin")}</button></div>`;$("#adm").onclick=()=>go("adminlogin");$("#lg").onclick=()=>go("lang");return;}
  app.innerHTML=`<h2>${t("vanakkam")}, ${esc(S.user.name)}</h2><p class="lead">${t("mobile")}: ${esc(S.user.phone)}</p>
  <button class="btn" id="new">${t("newProb")}</button>
  <h3>${t("myEnq")}</h3><div class="list" id="mine"><p class="note">${t("loading")}</p></div>
  <div class="grid"><button class="btn ghost" id="lg">${t("lang")}</button><button class="btn ghost" id="out">${t("logout")}</button></div>
  <p class="foot"><button id="adm">${t("advLogin")}</button></p>`;
  $("#new").onclick=goHome; $("#lg").onclick=()=>go("lang"); $("#adm").onclick=()=>go("adminlogin");
  $("#out").onclick=()=>{logout();goHome()};
  api("my",{token:S.user.token}).then(r=>{$("#mine").innerHTML=r.items.length?r.items.map(e=>`<div class="enq" data-id="${esc(e.id)}"><div class="h"><span class="who">${esc(e.problem)}</span><span class="badge ${esc(e.status.split(" ")[0])}">${esc(t("st_"+e.status))}</span></div>
      <span class="meta">${esc(e.time)} · Ref ${esc(e.id)} · ${e.files||0} ${t("docsCount")}</span>${e.note?`<div class="txt">${t("note")}: ${esc(e.note)}</div>`:""}
      <label class="btn small ghost filebtn">${IC.clip} ${t("addDocs")}<input type="file" accept="image/*,application/pdf" multiple hidden data-more></label><span class="note" data-ok></span></div>`).join(""):`<p class="note">${t("noEnq")}</p>`;
    app.querySelectorAll("[data-more]").forEach(inp=>inp.onchange=async()=>{const c=inp.closest("[data-id]"),ok=c.querySelector("[data-ok]");const fs=[];
      for(const f of [...inp.files].slice(0,MAXF)){try{fs.push(await readFile(f))}catch(e){}} if(!fs.length)return; ok.textContent=t("sending");
      api("addFiles",{token:S.user.token,id:c.dataset.id,files:fs.map(f=>({name:f.name,type:f.type,data:f.data}))}).then(()=>ok.textContent=t("added")).catch(e=>ok.textContent=e.error||"Error");});})
   .catch(e=>{if(e&&e.code==="auth"){logout();go("login");return;} $("#mine").innerHTML=`<div class="msg err">${esc(e.error||"Error")}</div>`;});
};

/* ---------- Advocate dashboard (private) ---------- */
V.adminlogin=()=>{
  app.innerHTML=`${backBtn()}<h2>Advocate login</h2><p class="lead">Only for Advocate A. Neeraj's office.</p>
  ${hasBackend()?`<section class="card"><label>Password<input id="apw" type="password" autocomplete="current-password"></label><button class="btn" id="go">Open dashboard</button></section><div id="am"></div>`
   :`<div class="card"><p>The dashboard works only after the app is connected to your Google Sheet.</p></div>`}`;
  bindBack(); const g=$("#go"); if(!g)return;
  const login=()=>{const pw=$("#apw").value; g.disabled=true; api("admin",{password:pw}).then(d=>{S.admin.pw=pw;S.admin.data=d;S.view="admin";render()}).catch(e=>{$("#am").innerHTML=`<div class="msg err">${esc(e.error||"Wrong password.")}</div>`;g.disabled=false;});};
  g.onclick=login; $("#apw").onkeydown=e=>{if(e.key==="Enter")login()};
};
V.admin=()=>{
  const A=S.admin,d=A.data; if(!d){S.view="adminlogin";return render();}
  const ST=["New","Called","Meeting fixed","Case filed","Closed"], s=d.stats;
  const enq=d.enquiries.filter(e=>(A.filter==="All"||e.status===A.filter)&&(!A.q||(e.name+" "+e.phone+" "+e.problem+" "+e.area+" "+e.details).toLowerCase().includes(A.q.toLowerCase())));
  const users=d.users.filter(u=>!A.q||(u.name+" "+u.phone+" "+u.district).toLowerCase().includes(A.q.toLowerCase()));
  app.innerHTML=`<div class="list" style="gap:4px"><span class="crumb">Advocate dashboard · private</span><h2>Members and enquiries</h2></div>
  <div class="stat">${[[s.members,"Members"],[s.verified,"WhatsApp verified"],[s.today,"Active today"],[s.week,"Active 7 days"],[s.enquiries,"Enquiries"],[s.fresh,"New"]].map(([n,l])=>`<div><b>${n}</b><span>${l}</span></div>`).join("")}</div>
  <div class="seg"><button data-tab="enq" aria-pressed="${A.tab==="enq"}">Enquiries</button><button data-tab="users" aria-pressed="${A.tab==="users"}">Members</button></div>
  <div class="field-search">${IC.search}<input id="aq" type="search" placeholder="Search name, phone, problem" value="${esc(A.q)}"></div>
  ${A.tab==="enq"?`<div class="chips">${["All",...ST].map(x=>`<button class="chip" data-f="${x}" aria-pressed="${A.filter===x}">${x}</button>`).join("")}</div>
   <div class="list">${enq.map(e=>`<div class="enq" data-id="${esc(e.id)}"><div class="h"><span class="who">${esc(e.name)}</span><span class="badge ${esc(e.status.split(" ")[0])}">${esc(e.status)}</span></div>
     <span class="meta">${esc(e.time)} · ${esc(e.phone)} · Ref ${esc(e.id)}</span><b>${esc(e.area)} – ${esc(e.problem)}</b><div class="txt">${esc(e.details)}</div>
     ${e.files&&e.files.length?`<div class="btnrow">${e.files.map((f,i)=>`<a class="btn small ghost" target="_blank" rel="noopener" href="${esc(f)}">File ${i+1}</a>`).join("")}</div>`:""}
     <div class="btnrow"><a class="btn small" href="tel:+91${esc(e.phone)}">Call</a><a class="btn small wa" target="_blank" rel="noopener" href="${waLink("Vanakkam "+e.name+", this is Advocate A. Neeraj's office regarding your enquiry "+e.id+".","91"+e.phone)}">WhatsApp</a></div>
     <label style="font-size:17px">Status<select data-st>${ST.map(x=>`<option ${x===e.status?"selected":""}>${x}</option>`).join("")}</select></label>
     <label style="font-size:17px">Note to client<input data-nt value="${esc(e.note||"")}" placeholder="e.g. Meeting on Monday 11 am"></label>
     <button class="btn small ghost" data-save>Save</button><span class="note" data-ok></span></div>`).join("")||`<p class="note">No enquiries.</p>`}</div>`
  :`<div class="list">${users.map(u=>`<div class="enq"><div class="h"><span class="who">${esc(u.name)}</span><span class="badge ${u.verified==="Verified"?"Closed":""}">${esc(u.verified)}</span></div>
     <span class="meta">${esc(u.phone)} · ${esc(u.district||"")} · ${esc(u.lang||"")}<br>Joined ${esc(u.time)} · Last seen ${esc(u.last||"-")} · Visits ${esc(u.visits||0)}</span>
     <div class="btnrow"><a class="btn small" href="tel:+91${esc(u.phone)}">Call</a><a class="btn small wa" target="_blank" rel="noopener" href="https://wa.me/91${esc(u.phone)}">WhatsApp</a></div></div>`).join("")||`<p class="note">No members yet.</p>`}</div>`}
  <button class="btn ghost" id="ref">Refresh</button><button class="btn ghost" id="lo">Close dashboard</button>`;
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{A.tab=b.dataset.tab;render()});
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{A.filter=b.dataset.f;render()});
  const aq=$("#aq"); aq.onchange=()=>{A.q=aq.value;render()};
  app.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{const c=b.closest("[data-id]"),id=c.dataset.id,status=c.querySelector("[data-st]").value,note=c.querySelector("[data-nt]").value,ok=c.querySelector("[data-ok]");
    b.disabled=true; api("setStatus",{password:A.pw,id,status,note}).then(()=>{const e=d.enquiries.find(x=>x.id===id);e.status=status;e.note=note;const bd=c.querySelector(".badge");bd.textContent=status;bd.className="badge "+status.split(" ")[0];ok.textContent="Saved.";b.disabled=false;}).catch(e=>{ok.textContent=e.error||"Not saved";b.disabled=false;});});
  $("#ref").onclick=()=>api("admin",{password:A.pw}).then(x=>{A.data=x;render()});
  $("#lo").onclick=()=>{S.admin={pw:null,data:null,tab:"enq",filter:"All",q:""};goHome()};
};

/* ---------- Start ---------- */
if("serviceWorker" in navigator && location.protocol.startsWith("http") && !inGAS()) navigator.serviceWorker.register("sw.js").catch(()=>{});
function start(){
  if(!LANG){S.view="lang";render();return;}
  S.view=gate("home"); render();
  if(S.user&&hasBackend()) api("ping",{token:S.user.token,lang:LANG}).catch(e=>{if(e&&e.code==="auth"){logout();goHome();}});
}
start();

</script>
</body>
</html>
